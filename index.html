<!DOCTYPE html>
<!--
  LOWandFUM — 两人的空间
  ======================
  用 Firebase 重新做的版本：登入、发帖、照片/影片上传都改用
  Firebase 的 Authentication / Firestore / Storage，取代原本
  Google Apps Script 那套。
  Rebuilt on Firebase: login, posting, and photo/video uploads now
  use Firebase Authentication / Firestore / Storage instead of the
  original Google Apps Script setup.
-->
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>两人的空间</title>

<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="两人的空间">
<meta name="theme-color" content="#14131A">

<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(1.5px 1.5px at 15% 8%, rgba(255,255,255,0.9), transparent),
      radial-gradient(1px 1px at 32% 18%, rgba(255,255,255,0.7), transparent),
      radial-gradient(1.5px 1.5px at 68% 5%, rgba(255,255,255,0.8), transparent),
      radial-gradient(1px 1px at 82% 22%, rgba(255,255,255,0.6), transparent),
      radial-gradient(1.5px 1.5px at 45% 35%, rgba(255,255,255,0.7), transparent),
      radial-gradient(1px 1px at 12% 45%, rgba(255,255,255,0.5), transparent),
      radial-gradient(1.5px 1.5px at 90% 55%, rgba(255,255,255,0.8), transparent),
      radial-gradient(1px 1px at 25% 62%, rgba(255,255,255,0.6), transparent),
      radial-gradient(1.5px 1.5px at 58% 75%, rgba(255,255,255,0.7), transparent),
      radial-gradient(1px 1px at 78% 85%, rgba(255,255,255,0.5), transparent),
      radial-gradient(1.5px 1.5px at 10% 92%, rgba(255,255,255,0.6), transparent),
      radial-gradient(1px 1px at 95% 95%, rgba(255,255,255,0.5), transparent),
      #14131A;
    background-attachment: fixed;
    font-family: 'Georgia', 'Noto Serif SC', 'PingFang SC', serif;
    color: #E8E3D8;
    position: relative;
  }
  /* 小小的弯月，固定在画面右上角 / a small crescent moon, fixed in the upper-right */
  body::before {
    content: '';
    position: fixed;
    top: 24px; right: 28px;
    width: 26px; height: 26px;
    border-radius: 50%;
    background: #E8DCC0;
    box-shadow: -8px 2px 0 0 #14131A;
    opacity: 0.85;
    z-index: 0;
    pointer-events: none;
  }
  }
  .container {
    max-width: 480px;
    margin: 0 auto;
    padding: 16px;
    padding-bottom: 60px;
  }
  .card {
    position: relative;
    background: rgba(40,38,48,0.92);
    border-radius: 16px;
    border: 0.5px solid #3A3540;
    padding: 14px;
    margin-bottom: 14px;
  }
  textarea, input[type="text"] {
    width: 100%;
    border: 0.5px solid #3A3540;
    border-radius: 10px;
    padding: 10px;
    font-size: 16px;
    font-family: inherit;
    background: #221F29;
    color: #E8E3D8;
    resize: none;
  }
  .upload-row { display: flex; gap: 8px; margin-top: 10px; }
  .upload-btn {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    font-size: 13px;
    background: #221F29;
    border: 0.5px solid #3A3540;
    border-radius: 10px;
    color: #B8935F;
    padding: 10px;
    cursor: pointer;
  }
  .preview-row { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .preview-thumb { width: 56px; height: 56px; border-radius: 8px; object-fit: cover; border: 0.5px solid #DCC8F0; }
  .post-btn {
    width: 100%;
    margin-top: 12px;
    background: #B8935F;
    color: #1C1B23;
    border: none;
    font-weight: bold;
    font-size: 14px;
    border-radius: 999px;
    padding: 11px;
    cursor: pointer;
  }
  .post-btn:disabled { opacity: 0.5; }
  .post-author { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .avatar {
    width: 32px; height: 32px; border-radius: 50%;
    background: #3A3540; display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: bold; color: #B8935F;
  }
  .post-media img, .post-media video { width: 100%; border-radius: 12px; margin-top: 8px; display: block; }
  .post-media.multi-media {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    -webkit-overflow-scrolling: touch;
    padding-bottom: 4px;
  }
  .post-media.multi-media .media-item {
    flex: 0 0 82%;
    aspect-ratio: 4 / 5;
    scroll-snap-align: start;
    margin-top: 8px;
  }
  .post-media.multi-media .media-item img,
  .post-media.multi-media .media-item video { width: 100%; height: 100%; object-fit: cover; }
  .reactions-row { display: flex; gap: 4px; margin-top: 10px; flex-wrap: wrap; }
  .react-btn { background: none; border: none; padding: 4px 8px; cursor: pointer; border-radius: 999px; transition: padding 0.25s ease, opacity 0.25s ease, margin 0.25s ease; }
  .react-btn span.emoji { width: 26px; height: 26px; display: inline-block; transition: width 0.25s cubic-bezier(.34,1.56,.64,1), height 0.25s cubic-bezier(.34,1.56,.64,1), opacity 0.25s ease, filter 0.25s ease; }
  .react-btn span.emoji img { width: 100%; height: 100%; object-fit: contain; display: block; pointer-events: none; }
  .react-btn.selected span.emoji { width: 36px; height: 36px; filter: drop-shadow(0 2px 5px rgba(184,147,95,0.6)) saturate(1.3); }

  /* 每个表情各自不同的小动作，点选时播放一次 */
  /* Each emoji gets its own little flourish, played once on tap */
  @keyframes anim-fly-spin {
    0% { transform: translateY(0) rotate(0deg) scale(1); }
    55% { transform: translateY(-34px) rotate(300deg) scale(1.3); }
    100% { transform: translateY(-4px) rotate(360deg) scale(1); }
  }
  @keyframes anim-nod {
    0%, 100% { transform: rotate(0deg); }
    30% { transform: rotate(-18deg); }
    55% { transform: rotate(10deg); }
    75% { transform: rotate(-6deg); }
  }
  @keyframes anim-flex {
    0%, 100% { transform: scale(1); }
    45% { transform: scale(1.55); }
    70% { transform: scale(0.95); }
  }
  @keyframes anim-wobble {
    0%, 100% { transform: rotate(0deg); }
    25% { transform: rotate(-14deg); }
    50% { transform: rotate(0deg); }
    75% { transform: rotate(14deg); }
  }
  @keyframes anim-shake {
    0%, 100% { transform: translateX(0) rotate(0deg); }
    20% { transform: translateX(-4px) rotate(-9deg); }
    40% { transform: translateX(4px) rotate(9deg); }
    60% { transform: translateX(-4px) rotate(-9deg); }
    80% { transform: translateX(4px) rotate(9deg); }
  }
  .react-anim-Love { animation: anim-fly-spin 0.9s ease; }
  .react-anim-Like { animation: anim-nod 0.75s ease; }
  .react-anim-Support { animation: anim-flex 0.75s ease; }
  .react-anim-Hug { animation: anim-wobble 0.9s ease; }
  .react-anim-Angry { animation: anim-shake 0.65s ease; }
  @media (prefers-reduced-motion: reduce) {
    .react-anim-Love, .react-anim-Like, .react-anim-Support, .react-anim-Hug, .react-anim-Angry { animation: none; }
  }

  /* 大动作：从左横扫到右，盖过整篇帖子，比较生动活泼 */
  /* Big effect: sweeps from left to right across the whole post — lively and energetic */
  .reaction-burst, .comment-burst {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    z-index: 20;
    overflow: hidden;
  }
  .reaction-burst .burst-main {
    width: 88px;
    height: 88px;
    filter: drop-shadow(0 6px 16px rgba(0,0,0,0.5));
  }
  .reaction-burst .burst-main img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .comment-burst span {
    font-size: 88px;
    filter: drop-shadow(0 6px 16px rgba(0,0,0,0.5));
  }
  /* 背景那层半透明的"意象闪烁"，跟主动作同时出现，但不跟着动作移动 */
  /* The translucent background flicker — plays alongside the main
     animation but stays put, doesn't travel across the card */
  .burst-echo {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 130px;
    height: 130px;
    opacity: 0;
    z-index: -1;
  }
  .burst-echo img { width: 100%; height: 100%; object-fit: contain; display: block; filter: blur(2px); }
  @keyframes flicker-echo {
    0%, 100% { opacity: 0; }
    20% { opacity: 0.4; }
    35% { opacity: 0.1; }
    50% { opacity: 0.35; }
    65% { opacity: 0.08; }
    80% { opacity: 0.3; }
  }
  .burst-Love .burst-echo, .burst-Like .burst-echo, .burst-Support .burst-echo,
  .burst-Hug .burst-echo, .burst-Angry .burst-echo {
    animation: flicker-echo 1.1s ease forwards;
  }
  @keyframes sweep-love {
    0% { transform: translate(-120%, 40%) scale(0.5) rotate(-20deg); opacity: 0; }
    15% { opacity: 1; }
    35% { transform: translate(-40%, -60%) scale(1.2) rotate(120deg); }
    60% { transform: translate(45%, 30%) scale(1.3) rotate(240deg); }
    85% { opacity: 1; }
    100% { transform: translate(130%, -55%) scale(0.6) rotate(400deg); opacity: 0; }
  }
  @keyframes sweep-like {
    0% { transform: translate(-120%, -45%) scale(0.5) rotate(0deg); opacity: 0; }
    15% { opacity: 1; }
    32% { transform: translate(-35%, 45%) scale(1.2) rotate(-14deg); }
    55% { transform: translate(35%, -35%) scale(1.25) rotate(10deg); }
    72% { transform: translate(-5%, 25%) scale(1.15) rotate(-8deg); }
    85% { opacity: 1; }
    100% { transform: translate(125%, -25%) scale(0.6) rotate(0deg); opacity: 0; }
  }
  @keyframes sweep-support {
    0% { transform: translate(10%, 125%) scale(0.5); opacity: 0; }
    15% { opacity: 1; }
    40% { transform: translate(-35%, -15%) scale(1.5); }
    62% { transform: translate(30%, 15%) scale(1.2); }
    85% { opacity: 1; }
    100% { transform: translate(-10%, -130%) scale(0.6); opacity: 0; }
  }
  @keyframes sweep-hug {
    0% { transform: translate(-110%, 0%) scale(0.5) rotate(0deg); opacity: 0; }
    15% { opacity: 1; }
    32% { transform: translate(-45%, -65%) scale(1.2) rotate(-20deg); }
    52% { transform: translate(25%, -30%) scale(1.25) rotate(20deg); }
    72% { transform: translate(50%, 45%) scale(1.15) rotate(-15deg); }
    85% { opacity: 1; }
    100% { transform: translate(115%, 85%) scale(0.6) rotate(0deg); opacity: 0; }
  }
  @keyframes sweep-angry {
    0% { transform: translate(-115%, -35%) scale(0.5); opacity: 0; }
    15% { opacity: 1; }
    27% { transform: translate(-60%, 45%) scale(1.3) rotate(-15deg); }
    38% { transform: translate(-40%, -45%) scale(1.3) rotate(15deg); }
    49% { transform: translate(-5%, 35%) scale(1.3) rotate(-15deg); }
    60% { transform: translate(25%, -35%) scale(1.3) rotate(15deg); }
    71% { transform: translate(50%, 25%) scale(1.3) rotate(-15deg); }
    85% { opacity: 1; }
    100% { transform: translate(120%, -65%) scale(0.6) rotate(0deg); opacity: 0; }
  }
  @keyframes sweep-comment {
    0% { transform: translateX(-130%) scale(0.5) rotate(-15deg); opacity: 0; }
    15% { opacity: 1; }
    50% { transform: translateX(0) scale(1.25) rotate(10deg); opacity: 1; }
    85% { opacity: 1; }
    100% { transform: translateX(130%) scale(0.6) rotate(20deg); opacity: 0; }
  }
  .burst-Love .burst-main { animation: sweep-love 1.2s ease forwards; }
  .burst-Like .burst-main { animation: sweep-like 1.2s ease forwards; }
  .burst-Support .burst-main { animation: sweep-support 1.2s ease forwards; }
  .burst-Hug .burst-main { animation: sweep-hug 1.3s ease forwards; }
  .burst-Angry .burst-main { animation: sweep-angry 1.1s ease forwards; }
  .comment-burst span { animation: sweep-comment 1s ease forwards; }
  @media (prefers-reduced-motion: reduce) {
    .reaction-burst, .comment-burst { display: none; }
  }
  /* 表情飛到帖子正中間、播放完整動畫影片，播完再飛回原位 */
  /* The emoji flies to the center of the post, plays its full master
     animation video, then flies back to where it started */
  .fly-overlay {
    position: fixed;
    left: 0; top: 0;
    pointer-events: none;
    z-index: 999;
    will-change: transform, opacity;
    transform-origin: center center;
    background: transparent;
    border-radius: 6px;
    overflow: hidden;
  }
  .fly-overlay video {
    width: 100%; height: 100%;
    object-fit: contain;
    display: block;
    mix-blend-mode: screen;
  }
  .video-pool { position: fixed; left: -9999px; top: -9999px; width: 1px; height: 1px; overflow: hidden; }
  .react-btn.flying-source { opacity: 0.15; }
  .react-btn.dimmed { padding: 2px 3px; margin: 0 -2px; }
  .react-btn.dimmed span.emoji { width: 18px; height: 18px; opacity: 0.55; filter: grayscale(35%); }
  .comments-box { border-top: 0.5px solid #3A3540; margin-top: 10px; padding-top: 8px; }
  .comment-line { font-size: 13px; color: #A89A8C; margin: 4px 0; white-space: pre-wrap; }
  @keyframes comment-pop-in {
    0% { opacity: 0; transform: translateY(10px) scale(0.9); }
    60% { opacity: 1; transform: translateY(-2px) scale(1.03); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }
  .comment-line.comment-new { animation: comment-pop-in 0.4s ease; }
  @media (prefers-reduced-motion: reduce) {
    .comment-line.comment-new { animation: none; }
  }
  .comment-send.just-sent { animation: anim-flex 0.4s ease; }
  .comment-input-row { display: flex; gap: 6px; margin-top: 8px; align-items: flex-end; }
  .comment-input-row textarea {
    flex: 1; resize: none; min-height: 38px; max-height: 120px;
  }
  .comment-send { background: #B8935F; color: #1C1B23; border: none; border-radius: 999px; padding: 0 14px; font-size: 13px; cursor: pointer; }
  .loading-text { text-align: center; color: #6B6560; font-size: 13px; padding: 20px; }

  .post-header-row { display: flex; align-items: center; justify-content: space-between; }
  .post-menu-btn {
    background: none; border: none; font-size: 20px; font-weight: bold;
    color: #B39FB0; cursor: pointer; padding: 4px 8px;
  }
  .dropdown-menu {
    position: absolute; z-index: 1000; background: #221F29; border-radius: 10px;
    border: 0.5px solid #3A3540; box-shadow: 0 4px 16px rgba(0,0,0,0.4); overflow: hidden;
  }
  .dropdown-menu button {
    display: block; width: 100%; padding: 10px 18px; background: none; border: none;
    font-size: 14px; color: #E08A8A; cursor: pointer; white-space: nowrap; text-align: left;
  }
  .media-item { position: relative; margin-top: 8px; }
  .media-item img, .media-item video { margin-top: 0; }
  .media-menu-btn {
    position: absolute; bottom: 8px; right: 8px; width: 30px; height: 30px; border-radius: 50%;
    background: rgba(0,0,0,0.55); color: #fff; border: none; font-size: 18px; font-weight: bold;
    line-height: 26px; text-align: center; cursor: pointer; z-index: 5;
  }

  /* 登入画面 / Login screen */
  .login-screen {
    position: fixed; inset: 0; z-index: 9999;
    background: #14131A;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: #C9B896; text-align: center; padding: 20px;
  }
  .login-screen h1 { font-size: 22px; margin-bottom: 24px; }
  .google-btn {
    background: #fff; color: #333; border: none; border-radius: 999px;
    padding: 12px 28px; font-size: 15px; cursor: pointer;
    display: flex; align-items: center; gap: 10px;
  }
  .login-error { color: #e08a9a; font-size: 13px; margin-top: 16px; }

  .tap-enter-screen {
    position: fixed; inset: 0; z-index: 9998;
    background: #14131A;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: #C9B896; text-align: center; cursor: pointer;
    transition: opacity 0.6s ease;
  }
  .tap-enter-screen.hidden { opacity: 0; pointer-events: none; }
  .tap-enter-screen h1 { font-size: 22px; }
  .tap-enter-screen p { font-size: 14px; animation: tap-pulse 1.6s ease-in-out infinite; }
  @keyframes tap-pulse { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }

  .title-banner { text-align: center; padding: 20px 12px 6px; }
  .title-banner img { max-width: 92%; height: auto; filter: drop-shadow(0 4px 10px rgba(0,0,0,0.5)); }
</style>
</head>
<body>

<!-- 登入画面 / Login screen -->
<div class="login-screen" id="loginScreen">
  <h1>两人的空间</h1>
  <button class="google-btn" id="googleLoginBtn">
    <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84c-.21 1.13-.84 2.09-1.8 2.73v2.27h2.92c1.7-1.57 2.68-3.88 2.68-6.64z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.27c-.8.54-1.83.86-3.04.86-2.34 0-4.32-1.58-5.03-3.71H.96v2.33C2.44 15.98 5.48 18 9 18z"/><path fill="#FBBC05" d="M3.97 10.7c-.18-.54-.28-1.11-.28-1.7s.1-1.16.28-1.7V4.97H.96C.35 6.19 0 7.55 0 9s.35 2.81.96 4.03l3.01-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0 5.48 0 2.44 2.02.96 4.97l3.01 2.33C4.68 5.16 6.66 3.58 9 3.58z"/></svg>
    用 Google 登入 / Sign in with Google
  </button>
  <p class="login-error" id="loginError"></p>
</div>

<!-- 点击进入画面：不管是不是第一次登入都会经过这里，确保音乐一定能开始播放 -->
<!-- Tap-to-enter screen: always shown regardless of fresh or returning login, so music reliably gets a user tap to start from -->
<div class="tap-enter-screen" id="tapEnterScreen" style="display:none;">
  <h1>两人的空间</h1>
  <p>点击进入 / Tap to enter</p>
</div>

<!-- 背景音乐 / Background music -->
<audio id="bgMusic" src="music.mp3" loop></audio>

<!-- 預先載入的 5 個表情動畫影片，平常藏在畫面外 / preloaded master animation videos, hidden off-screen until used -->
<div class="video-pool" id="videoPool"></div>

<div class="container" id="mainContent" style="display:none;">

  <div class="title-banner">
    <img src="title-banner.png" alt="属于我们两人的空间">
  </div>

  <div class="card">
    <textarea id="postContent" rows="3" placeholder="写下这一刻的心情... / Write what's on your mind..."></textarea>
    <div class="upload-row">
      <label class="upload-btn">
        照片 / Photo
        <input type="file" id="photoInput" accept="image/*" multiple style="display:none;">
      </label>
      <label class="upload-btn">
        影片 / Video
        <input type="file" id="videoInput" accept="video/*" style="display:none;">
      </label>
    </div>
    <div class="preview-row" id="previewRow"></div>
    <button class="post-btn" id="postBtn">发布 / Post</button>
  </div>

  <div id="feed">
    <p class="loading-text">载入中... / Loading...</p>
  </div>

</div>

// ===== 推播通知：跟你要权限、记住这台手机 =====
// ===== Push notifications: ask permission, remember this device =====
async function setupNotifications() {
  try {
    // 通知权限要放在最前面第一步问，越靠近点击那一刻越好
    // Ask for notification permission as the very first step — the
    // closer to the actual tap, the better
    const permission = await Notification.requestPermission();
    if (permission !== 'granted') return;

    const supported = await messagingIsSupported();
    if (!supported) return; // 这个浏览器不支援推播 / this browser doesn't support push

    const registration = await navigator.serviceWorker.register('firebase-messaging-sw.js');

    const messaging = getMessaging(app);
    const token = await getToken(messaging, { vapidKey: VAPID_KEY, serviceWorkerRegistration: registration });
    if (token) {
      // 把这个装置的推播代码存进这个人自己的资料里，Cloud Function 之后会用它来发通知
      // Save this device's push token under the user's own doc — the
      // Cloud Function will use it later to actually send notifications
      await setDoc(doc(db, 'users', currentUser.uid), {
        email: currentUser.email,
        fcmToken: token
      }, { merge: true });
    }
  } catch (err) {
    // 通知设定失败不影响网站其他部分正常使用 / notification setup failing shouldn't affect the rest of the app
  }
}

// 让音量慢慢改变，而不是一下子跳掉 / smoothly change volume instead of jumping
function fadeVolume(audioEl, targetVolume, durationMs) {
  const startVolume = audioEl.volume;
  const startTime = Date.now();
  const step = function() {
    const progress = Math.min(1, (Date.now() - startTime) / durationMs);
    audioEl.volume = startVolume + (targetVolume - startVolume) * progress;
    if (progress < 1) requestAnimationFrame(step);
  };
  step();
}

// 点击进入画面：点了才开始播放音乐、才真正进网站
// Tap-to-enter: tapping is what starts the music and reveals the site
document.getElementById('tapEnterScreen').addEventListener('click', function enterApp() {
  const screen = document.getElementById('tapEnterScreen');
  const bgMusic = document.getElementById('bgMusic');

  bgMusic.volume = 1.0;
  bgMusic.play().catch(function() {
    // 有些浏览器还是会拒绝播放，忽略就好，不影响其他功能 / some browsers may still refuse — ignore
  });

  // 通知权限一定要紧接在这个点击里面要求，不能等其他非同步流程跑完才问，
  // 不然 iOS 会直接判定不算数，自动拒绝、连问都不问
  // The notification permission must be requested directly inside this
  // click — not after other async steps finish — or iOS silently denies
  // it without ever showing the prompt
  setupNotifications();

  screen.classList.add('hidden');
  setTimeout(function() { screen.style.display = 'none'; }, 700);

  document.getElementById('mainContent').style.display = 'block';

  // 进入网站后，把背景音乐音量慢慢调低 / gently fade the music down once inside
  setTimeout(function() { fadeVolume(bgMusic, 0.3, 1200); }, 500);
});

    signOut(auth);

    document.getElementById('mainContent').style.display = 'none';
  }
});

document.getElementById('photoInput').addEventListener('change', function(e) {
  handleFiles(e.target.files, 'Photo');
});
document.getElementById('videoInput').addEventListener('change', function(e) {
  handleFiles(e.target.files, 'Video');

function handleFiles(files, type) {
  for (let i = 0; i < files.length; i++) {
    const file = files[i];
    pendingMedia.push({ file: file, type: type, previewUrl: URL.createObjectURL(file) });
  }
  renderPreviews();
}
function renderPreviews() {
  const row = document.getElementById('previewRow');
  row.innerHTML = '';
  pendingMedia.forEach(function(m) {
    const img = document.createElement('img');
    img.className = 'preview-thumb';
    img.src = m.previewUrl;
    row.appendChild(img);
  });
}

// ===== 发布帖子 / Submit a post =====
document.getElementById('postBtn').onclick = async function() {
  const content = document.getElementById('postContent').value.trim();
  if (!content && pendingMedia.length === 0) return;

  const btn = document.getElementById('postBtn');
  btn.disabled = true;
  btn.textContent = '发布中... / Posting...';

  try {
    const mediaList = [];
    for (const m of pendingMedia) {
      const ext = m.file.name.split('.').pop();
      const path = 'media/' + Date.now() + '_' + Math.floor(Math.random()*10000) + '.' + ext;
      const storageRef = ref(storage, path);
      await uploadBytes(storageRef, m.file);
      const url = await getDownloadURL(storageRef);
      mediaList.push({ url: url, type: m.type, path: path });
    }

    await addDoc(collection(db, 'posts'), {
      author: currentUser.email,
      content: content,
      media: mediaList,
      timestamp: serverTimestamp()
    });

    document.getElementById('postContent').value = '';
    pendingMedia = [];
    renderPreviews();
  } catch (err) {
    alert('发布失败 / Failed: ' + err.message);
  }
  btn.disabled = false;
  btn.textContent = '发布 / Post';
};

// ===== 载入动态消息 / Load the feed =====
function loadFeed() {
  const q = query(collection(db, 'posts'), orderBy('timestamp', 'desc'));
  onSnapshot(q, function(snapshot) {
    const feed = document.getElementById('feed');
    if (snapshot.empty) {
      feed.innerHTML = '<p class="loading-text">还没有帖子，写下第一篇吧 / No posts yet</p>';
      return;
    }
    feed.innerHTML = '';
    snapshot.forEach(function(docSnap) {
      feed.appendChild(buildPostCard(docSnap.id, docSnap.data()));
    });
  });
}

// 影片滑到画面 75% 以上就自动播放，滑走就暂停
// Auto-play a video once 75%+ of it is on screen; pause when it scrolls away
const videoAutoplayObserver = (typeof IntersectionObserver !== 'undefined')
  ? new IntersectionObserver(function(entries) {
      entries.forEach(function(entry) {
        if (entry.isIntersecting && entry.intersectionRatio >= 0.75) {
          entry.target.play().catch(function() { /* 有些浏览器可能拒绝，忽略就好 / some browsers may refuse — ignore */ });
        } else {
          entry.target.pause();
        }
      });
    }, { threshold: [0, 0.75, 1] })
  : null;

function observeVideoForAutoplay(videoEl) {
  if (videoAutoplayObserver) videoAutoplayObserver.observe(videoEl);
}

function buildPostCard(postId, post) {
  const card = document.createElement('div');
  card.className = 'card';
  const authorName = displayName(post.author);
  const initial = authorName.charAt(0).toUpperCase();

  card.innerHTML =
    '<div class="post-header-row">' +
      '<div class="post-author">' +
        '<div class="avatar">' + initial + '</div>' +
        '<div><strong style="font-size:13px;">' + authorName + '</strong></div>' +
      '</div>' +
      '<button class="post-menu-btn" id="postMenuBtn-' + postId + '">⋯</button>' +
    '</div>' +
    '<p id="content-' + postId + '" style="font-size:14px; margin:0 0 4px; white-space:pre-wrap;">' + escapeHtml(post.content || '') + '</p>' +
    '<div class="post-media" id="media-' + postId + '"></div>' +
    '<div class="reactions-row" id="react-' + postId + '"></div>' +
    '<div class="comments-box">' +
      '<div id="comments-' + postId + '"></div>' +
      '<div class="comment-input-row">' +
        '<textarea rows="1" placeholder="写留言... / Write a comment..." id="commentInput-' + postId + '" oninput="this.style.height=\'auto\';this.style.height=this.scrollHeight+\'px\';"></textarea>' +
        '<button class="comment-send" id="commentSend-' + postId + '" onclick="window.submitComment(\'' + postId + '\')">送出</button>' +
      '</div>' +
    '</div>';

  card.querySelector('#postMenuBtn-' + postId).onclick = function(e) {
    e.stopPropagation();
    showDropdownMenu(e.currentTarget, [
      { label: '✏️ 编辑帖子 / Edit post', onClick: function() { startEditPost(postId, post, card); } },
      { label: '🗑 删除帖子 / Delete post', onClick: function() { deletePost(postId, post); } }
    ]);
  };

  const mediaBox = card.querySelector('#media-' + postId);
  if ((post.media || []).length > 1) {
    mediaBox.classList.add('multi-media');
  }
  (post.media || []).forEach(function(m, idx) {
    const wrap = document.createElement('div');
    wrap.className = 'media-item';

    if (m.type === 'Video') {
      const v = document.createElement('video');
      v.src = m.url; v.controls = true;
      v.muted = true;       // 手机规定：滑到自动播放的影片一定要先静音 / mobile browsers require this for scroll-triggered autoplay
      v.playsInline = true; // 让影片在原地播放，不会自动跳成全萤幕 / plays inline instead of jumping to fullscreen on iOS
      v.loop = true;
      wrap.appendChild(v);
      observeVideoForAutoplay(v);
    } else {
      const img = document.createElement('img');
      img.src = m.url;
      wrap.appendChild(img);
    }

    const menuBtn = document.createElement('button');
    menuBtn.className = 'media-menu-btn';
    menuBtn.innerHTML = '⋯';
    menuBtn.onclick = function(e) {
      e.stopPropagation();
      showDropdownMenu(menuBtn, [
        { label: '🗑 删除照片/影片 / Delete photo', onClick: function() { deleteMediaItem(postId, post, m); } }
      ]);
    };
    wrap.appendChild(menuBtn);

    mediaBox.appendChild(wrap);
  });

  renderReactions(postId, card.querySelector('#react-' + postId));
  loadComments(postId, card.querySelector('#comments-' + postId));

  return card;
}

// 通用的小选单（点旁边空白处会自动关闭）
// A generic small dropdown menu (auto-closes when you tap elsewhere)
function showDropdownMenu(anchorBtn, items) {
  const existing = document.getElementById('dropdownMenu');
  if (existing) existing.remove();

  const menu = document.createElement('div');
  menu.id = 'dropdownMenu';
  menu.className = 'dropdown-menu';
  items.forEach(function(item) {
    const btn = document.createElement('button');
    btn.textContent = item.label;
    btn.onclick = function(e) {
      e.stopPropagation();
      menu.remove();
      item.onClick();
    };
    menu.appendChild(btn);
  });
  document.body.appendChild(menu);

  const rect = anchorBtn.getBoundingClientRect();
  menu.style.top = (window.scrollY + rect.bottom + 4) + 'px';
  menu.style.left = Math.max(8, rect.right - menu.offsetWidth) + 'px';

  setTimeout(function() {
    document.addEventListener('click', function closeMenu(e) {
      if (!menu.contains(e.target)) {
        menu.remove();
        document.removeEventListener('click', closeMenu);
      }
    });
  }, 0);
}

// 编辑帖子的文字（照片/影片不透过这里改，放错了直接用上面的删除功能）
// Edit a post's text (photos/videos aren't touched here — if one's wrong, just delete it directly)
function startEditPost(postId, post, card) {
  const p = card.querySelector('#content-' + postId);
  if (!p) return;

  const wrap = document.createElement('div');
  wrap.innerHTML =
    '<textarea id="editArea-' + postId + '" rows="3" style="width:100%;">' + escapeHtml(post.content || '') + '</textarea>' +
    '<div style="display:flex; gap:8px; margin-top:6px;">' +
      '<button id="editSave-' + postId + '" style="background:#B8935F; color:#1C1B23; border:none; border-radius:999px; padding:6px 16px; font-size:13px; cursor:pointer;">保存 / Save</button>' +
      '<button id="editCancel-' + postId + '" style="background:none; border:0.5px solid #3A3540; color:#E8E3D8; border-radius:999px; padding:6px 16px; font-size:13px; cursor:pointer;">取消 / Cancel</button>' +
    '</div>';

  p.replaceWith(wrap);

  wrap.querySelector('#editCancel-' + postId).onclick = function() {
    wrap.replaceWith(p);
  };

  wrap.querySelector('#editSave-' + postId).onclick = async function() {
    const newContent = wrap.querySelector('#editArea-' + postId).value.trim();
    try {
      await updateDoc(doc(db, 'posts', postId), { content: newContent });
      post.content = newContent;
      p.textContent = newContent;
      wrap.replaceWith(p);
    } catch (err) {
      alert('保存失败 / Save failed: ' + err.message);
    }
  };
}

// 删除整篇帖子（连带留言、Emoji 反应、照片影片都会一起删掉）
// Delete the whole post (comments, reactions, and its photos/videos all go with it)
async function deletePost(postId, post) {
  if (!confirm('确定要删除这篇帖子吗？删除后无法恢复。\nDelete this post? This cannot be undone.')) return;

  try {
    // 删掉帖子底下的留言 / delete the post's comments
    const commentsSnap = await getDocs(collection(db, 'posts', postId, 'comments'));
    for (const c of commentsSnap.docs) await deleteDoc(c.ref);

    // 删掉帖子底下的 Emoji 反应 / delete the post's reactions
    const reactionsSnap = await getDocs(collection(db, 'posts', postId, 'reactions'));
    for (const r of reactionsSnap.docs) await deleteDoc(r.ref);

    // 删掉照片/影片本身 / delete the actual photo/video files
    for (const m of (post.media || [])) {
      try { await deleteObject(ref(storage, m.path)); } catch (e) { /* 文件可能已经不见了，不影响 / file may already be gone */ }
    }

    // 最后删掉帖子本身 / finally delete the post itself
    await deleteDoc(doc(db, 'posts', postId));
  } catch (err) {
    alert('删除失败 / Delete failed: ' + err.message);
  }
}

// 删除帖子里的其中一张照片/影片（帖子本身留着）
// Delete a single photo/video from a post (the post itself stays)
async function deleteMediaItem(postId, post, mediaItem) {
  if (!confirm('确定要删除这张照片吗？删除后无法恢复。\nDelete this photo? This cannot be undone.')) return;

  try {
    await deleteObject(ref(storage, mediaItem.path));
    const updatedMedia = (post.media || []).filter(function(m) { return m.path !== mediaItem.path; });
    await updateDoc(doc(db, 'posts', postId), { media: updatedMedia });
  } catch (err) {
    alert('删除失败 / Delete failed: ' + err.message);
  }
}

// ===== Emoji 反应 / Reactions =====
// ---- 預先把 5 個 MASTER 影片都準備好，各自可以借出多份 ----
// ---- 避免兩篇貼文同時用同一種表情時互相搶用同一個 <video> ----
// Prepares all 5 MASTER videos ahead of time. Each type keeps a small
// pool of reusable <video> elements, so two different posts reacting
// with the SAME emoji type at the same time don't fight over one
// shared element.
const videoPoolEl = document.getElementById('videoPool');
const videoElementsPool = {};
Object.keys(VIDEO_MAP).forEach(function(type) { videoElementsPool[type] = []; });

function createPooledVideo(type) {
  const v = document.createElement('video');
  v.src = VIDEO_MAP[type];
  v.muted = true;
  v.playsInline = true;
  v.setAttribute('playsinline', '');
  v.preload = 'auto';
  v.load();
  videoPoolEl.appendChild(v);
  return v;
}
// 先幫每一種都預先建好、預載一份 / pre-warm one instance per type
Object.keys(VIDEO_MAP).forEach(function(type) { videoElementsPool[type].push(createPooledVideo(type)); });

function acquireVideo(type) {
  const pool = videoElementsPool[type];
  if (pool.length > 0) return pool.pop();
  return createPooledVideo(type); // 不夠用就臨時多建一份 / make an extra one on demand
}
function releaseVideo(type, v) {
  videoPoolEl.appendChild(v);
  videoElementsPool[type].push(v);
}

// 每篇貼文同時只允許一個表情在飛/播放中，換選別的表情時，前一個會瞬間消失，不會疊在一起
// Each post allows only one flying/playing emoji at a time — picking a
// different one makes the previous one disappear instantly instead of
// overlapping with it
const flightState = {}; // key: postId -> { overlay, video, type, sourceBtn, timers }
const flyToCenterDuration = 280;
const returnDuration = 250;
const centerScale = 5;
const centerOpacity = 0.65;
const restScale = 1;
const restOpacity = 1;
const targetPlaySeconds = 3; // 原片 5 秒，加速壓縮成 3 秒播完 / source is 5s, sped up to finish in ~3s

function playFlyToCenter(postId, emojiType, sourceBtn) {
  if (!VIDEO_MAP[emojiType]) return;
  const card = sourceBtn.closest('.card');
  if (!card) return;

  // 如果這篇貼文已經有表情在飛，先瞬間收掉再開始新的
  if (flightState[postId]) {
    cleanupFlight(postId, true);
  }

  const video = acquireVideo(emojiType);
  const emojiSpan = sourceBtn.querySelector('.emoji');
  const startRect = emojiSpan.getBoundingClientRect();
  const cardRect = card.getBoundingClientRect();

  const postCenterX = cardRect.left + cardRect.width / 2;
  const postCenterY = cardRect.top + cardRect.height / 2;
  const startW = startRect.width;
  const startH = startRect.height;
  const startCenterX = startRect.left + startW / 2;
  const startCenterY = startRect.top + startH / 2;
  const deltaX = postCenterX - startCenterX;
  const deltaY = postCenterY - startCenterY;

  sourceBtn.classList.add('flying-source');

  const overlay = document.createElement('div');
  overlay.className = 'fly-overlay';
  overlay.style.width = startW + 'px';
  overlay.style.height = startH + 'px';
  overlay.style.left = startRect.left + 'px';
  overlay.style.top = startRect.top + 'px';
  overlay.style.opacity = restOpacity;
  overlay.style.transform = 'translate(0px, 0px) scale(' + restScale + ') rotate(0deg)';
  overlay.appendChild(video);
  document.body.appendChild(overlay);

  flightState[postId] = { overlay: overlay, sourceBtn: sourceBtn, video: video, type: emojiType, timers: [] };

  overlay.style.transition = 'transform ' + flyToCenterDuration + 'ms cubic-bezier(.34,1.56,.64,1), opacity ' + flyToCenterDuration + 'ms ease';
  requestAnimationFrame(function() {
    requestAnimationFrame(function() {
      overlay.style.transform = 'translate(' + deltaX + 'px, ' + deltaY + 'px) scale(' + centerScale + ') rotate(6deg)';
      overlay.style.opacity = centerOpacity;
    });
  });

  const t1 = setTimeout(function() {
    overlay.style.transition = 'transform 120ms ease-out, opacity 120ms ease-out';
    overlay.style.transform = 'translate(' + deltaX + 'px, ' + deltaY + 'px) scale(' + centerScale + ') rotate(0deg)';
    overlay.style.opacity = '1';

    video.currentTime = 0;
    const playbackRate = (video.duration && isFinite(video.duration) && video.duration > 0)
      ? (video.duration / targetPlaySeconds) : 1;
    video.playbackRate = playbackRate;
    const playPromise = video.play();
    if (playPromise && playPromise.catch) { playPromise.catch(function() {}); }

    const onEnded = function() { cleanupFlight(postId, false); };
    video.addEventListener('ended', onEnded, { once: true });
    flightState[postId].onEnded = onEnded;

    const actualPlayMs = (video.duration && isFinite(video.duration) ? (video.duration * 1000 / playbackRate) : targetPlaySeconds * 1000);
    const t2 = setTimeout(function() {
      if (flightState[postId]) cleanupFlight(postId, false);
    }, actualPlayMs + 400);
    flightState[postId].timers.push(t2);
  }, flyToCenterDuration);
  flightState[postId].timers.push(t1);
}

function cleanupFlight(postId, instant) {
  const state = flightState[postId];
  if (!state) return;
  delete flightState[postId];

  state.timers.forEach(clearTimeout);
  if (state.onEnded) state.video.removeEventListener('ended', state.onEnded);
  state.video.pause();

  const overlay = state.overlay;
  const finish = function() {
    overlay.remove();
    state.sourceBtn.classList.remove('flying-source');
    releaseVideo(state.type, state.video);
  };

  if (instant) { finish(); return; }

  overlay.style.transition = 'transform ' + returnDuration + 'ms cubic-bezier(.55,0,1,.45), opacity ' + returnDuration + 'ms ease';
  overlay.style.transform = 'translate(0px, 0px) scale(' + restScale + ') rotate(0deg)';
  overlay.style.opacity = restOpacity;
  setTimeout(finish, returnDuration + 30);
}

function renderReactions(postId, box) {
  box.innerHTML = '';
  Object.keys(EMOJI_MAP).forEach(function(type) {
    const btn = document.createElement('button');
    btn.className = 'react-btn';
    btn.dataset.type = type;
    btn.innerHTML = '<span class="emoji"><img src="' + EMOJI_MAP[type] + '" alt="' + type + '" draggable="false"></span>';
    btn.onclick = function() { toggleReaction(postId, type, box); };
    box.appendChild(btn);
  });

  const reactionRef = doc(db, 'posts', postId, 'reactions', currentUser.uid);
  getDoc(reactionRef).then(function(snap) {
    applySelectedState(box, snap.exists() ? snap.data().emojiType : null);
  });
}

// 播放这个 Emoji 专属的小动作 / Play this emoji's own little animation
// 留言送出成功时，整篇帖子也来一个大动作（飞信封橫扫过去）
// A big sweep across the whole post when a comment sends successfully (a flying love letter)
function playCommentBurst(anchorEl) {
  if (!anchorEl) return;
  const card = anchorEl.closest('.card');
  if (!card) return;
  const old = card.querySelector('.comment-burst');
  if (old) old.remove();
  const burst = document.createElement('div');
  burst.className = 'comment-burst';
  burst.innerHTML = '<span>💌</span>';
  card.appendChild(burst);
  burst.addEventListener('animationend', function() { burst.remove(); }, { once: true });
  setTimeout(function() { if (burst.parentNode) burst.remove(); }, 1500);
}

function playReactionAnimation(btn, emojiType) {
  if (!btn) return;
  const emojiSpan = btn.querySelector('.emoji');
  if (!emojiSpan) return;
  const className = 'react-anim-' + emojiType;
  emojiSpan.classList.remove(className); // 万一还没播完又点了一次，先重置 / reset in case it's still mid-animation
  void emojiSpan.offsetWidth; // 强迫浏览器重新计算一次，动画才会重新播放 / force a reflow so the animation restarts
  emojiSpan.classList.add(className);
  emojiSpan.addEventListener('animationend', function done() {
    emojiSpan.classList.remove(className);
    emojiSpan.removeEventListener('animationend', done);
  });

  // 大动作：整篇帖子盖上一个放大的表情 / the big burst covering the whole post
  const card = btn.closest('.card');
  if (card) {
    const old = card.querySelector('.reaction-burst');
    if (old) old.remove();
    const burst = document.createElement('div');
    burst.className = 'reaction-burst burst-' + emojiType;
    burst.innerHTML =
      '<span class="burst-echo"><img src="' + EMOJI_MAP[emojiType] + '" alt=""></span>' +
      '<span class="burst-main"><img src="' + EMOJI_MAP[emojiType] + '" alt=""></span>';
    card.appendChild(burst);
    burst.addEventListener('animationend', function() { burst.remove(); }, { once: true });
    // 保险：万一动画事件没触发，1.5 秒后强制清掉 / safety net in case the event never fires
    setTimeout(function() { if (burst.parentNode) burst.remove(); }, 1500);
  }
}

async function toggleReaction(postId, emojiType, box) {
  // 直接看画面上现在是不是已经选中，不用先问 Google（这样才不用等网路）
  // Read the current state directly from the screen instead of asking
  // Google first (this is what keeps it from waiting on the network)
  const targetBtn = box.querySelector('.react-btn[data-type="' + emojiType + '"]');
  const already = !!(targetBtn && targetBtn.classList.contains('selected'));

  // 立刻更新画面 / update the screen immediately
  if (already) {
    applySelectedState(box, null);
    if (flightState[postId]) cleanupFlight(postId, true);
  } else {
    applySelectedState(box, emojiType);
    playPopSound(emojiType);
    playFlyToCenter(postId, emojiType, targetBtn);
  }

  // 背景偷偷跟 Firestore 同步，不会挡住画面 / sync to Firestore in the background, without blocking the UI
  const reactionRef = doc(db, 'posts', postId, 'reactions', currentUser.uid);
  try {
    if (already) {
      await deleteDoc(reactionRef);
    } else {
      await setDoc(reactionRef, { emojiType: emojiType, author: currentUser.email });
    }
  } catch (err) {
    // 同步失败就把画面改回去，并告诉你 / if the sync fails, revert the screen and let you know
    applySelectedState(box, already ? emojiType : null);
    alert('Emoji 反应失败，请重试 / Reaction failed, please try again: ' + err.message);
  }
}

// 五种反应各自的小音效——用 Web Audio 直接合成，不用另外载音乐文件
// A distinct short sound for each reaction — synthesized directly via
// Web Audio, no separate sound files needed
let audioCtx = null;
function getAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}

// 播放一个音符：类型、频率、开始时间(相对秒)、长度(秒)、音量
// Play one tone: waveform, frequency, start offset (sec), duration (sec), volume
function playTone(waveType, freq, startOffset, duration, volume, glideToFreq) {
  const ctx = getAudioCtx();
  const startTime = ctx.currentTime + startOffset;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = waveType;
  osc.frequency.setValueAtTime(freq, startTime);
  if (glideToFreq) {
    osc.frequency.exponentialRampToValueAtTime(glideToFreq, startTime + duration);
  }
  gain.gain.setValueAtTime(volume, startTime);
  gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.start(startTime);
  osc.stop(startTime + duration);
}

function playPopSound(emojiType) {
  try {
    if (emojiType === 'Love') {
      // 温柔上扬的两个音，像小心跳 / gentle two-note rise, like a little heartbeat
      playTone('sine', 500, 0, 0.12, 0.14);
      playTone('sine', 660, 0.1, 0.18, 0.14);
    } else if (emojiType === 'Like') {
      // 清脆短促、正向 / crisp, quick, upbeat
      playTone('triangle', 700, 0, 0.1, 0.15, 1050);
    } else if (emojiType === 'Support') {
      // 低沉有力，比较扎实 / a firmer, lower, confident thump
      playTone('square', 220, 0, 0.16, 0.11);
      playTone('sine', 220, 0, 0.16, 0.08);
    } else if (emojiType === 'Hug') {
      // 柔和绵长，比较温暖 / soft and sustained, warm
      playTone('sine', 440, 0, 0.35, 0.1);
      playTone('sine', 550, 0.05, 0.32, 0.07);
    } else if (emojiType === 'Angry') {
      // 短促粗糙、往下掉，比较刺耳 / short, coarse, dropping — a bit sharp
      playTone('sawtooth', 380, 0, 0.16, 0.1, 180);
    } else {
      playTone('sine', 600, 0, 0.15, 0.15, 900);
    }
  } catch (e) {
    // 有些浏览器可能不支援，忽略就好，不影响其他功能
    // Some browsers may not support this — ignore, doesn't affect anything else
  }
}

function applySelectedState(box, selectedType) {
  Array.from(box.querySelectorAll('.react-btn')).forEach(function(b) {
    b.classList.remove('selected', 'dimmed');
    if (selectedType) {
      if (b.dataset.type === selectedType) b.classList.add('selected');
      else b.classList.add('dimmed');
    }
  });
}

// ===== 留言 / Comments =====
function loadComments(postId, box) {
  const q = query(collection(db, 'posts', postId, 'comments'), orderBy('timestamp', 'asc'));
  let firstLoad = true;
  onSnapshot(q, function(snapshot) {
    // 只有真正「新增」的留言才播放跳入动画，不会让旧留言每次都重播一次
    // Only genuinely new comments play the pop-in animation — old ones
    // don't replay it every time the list re-renders
    const newlyAddedIds = firstLoad ? [] : snapshot.docChanges()
      .filter(function(change) { return change.type === 'added'; })
      .map(function(change) { return change.doc.id; });
    firstLoad = false;

    box.innerHTML = '';
    snapshot.forEach(function(docSnap) {
      const c = docSnap.data();
      const line = document.createElement('p');
      line.className = 'comment-line';
      if (newlyAddedIds.indexOf(docSnap.id) !== -1) {
        line.classList.add('comment-new');
      }
      line.textContent = displayName(c.author) + ': ' + c.content;
      box.appendChild(line);
    });
  });
}

// 送出留言时的小音效 / A short sound for sending a comment
function playSendSound() {
  try {
    playTone('sine', 520, 0, 0.1, 0.12, 780);
  } catch (e) { /* 忽略即可 / ignore */ }
}

window.submitComment = async function(postId) {
  const input = document.getElementById('commentInput-' + postId);
  const content = input.value.trim();
  if (!content) return;
  input.value = '';
  input.style.height = 'auto';

  // 送出的瞬间给一点反馈：按钮跳一下 + 一声轻响 + 整篇帖子的大动作
  // A bit of feedback right at the moment of sending: button pulses,
  // a soft chime, and a big sweep animation across the whole post
  const sendBtn = document.getElementById('commentSend-' + postId);
  if (sendBtn) {
    sendBtn.classList.remove('just-sent');
    void sendBtn.offsetWidth;
    sendBtn.classList.add('just-sent');
  }
  playSendSound();
  playCommentBurst(sendBtn);

  await addDoc(collection(db, 'posts', postId, 'comments'), {
    author: currentUser.email,
    content: content,
    timestamp: serverTimestamp()
  });
};

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}
