<!DOCTYPE html>
<!--
  LOWandFUM — 两人的空间
  ======================
  用 Firebase 重新做的版本：登入、发帖、照片/影片上传都改用
  Firebase 的 Authentication / Firestore / Storage，取代原本
  Google Apps Script 那套。
  Rebuilt on Firebase: login, posting, and photo/video uploads now
  use Firebase Authentication / Firestore / Storage instead of the
  original Google Apps Script setup.
-->
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>两人的空间</title>

<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="两人的空间">
<meta name="theme-color" content="#1a1a2e">

<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: #F5F0FA;
    font-family: 'Noto Serif SC', 'PingFang SC', serif;
    color: #5D4E70;
  }
  .container {
    max-width: 480px;
    margin: 0 auto;
    padding: 16px;
    padding-bottom: 60px;
  }
  .card {
    background: rgba(255,255,255,0.95);
    border-radius: 16px;
    border: 0.5px solid #E4D6F0;
    padding: 14px;
    margin-bottom: 14px;
  }
  textarea, input[type="text"] {
    width: 100%;
    border: 0.5px solid #DCC8F0;
    border-radius: 10px;
    padding: 10px;
    font-size: 14px;
    font-family: inherit;
    background: #FBF7FE;
    color: #5D4E70;
    resize: none;
  }
  .upload-row { display: flex; gap: 8px; margin-top: 10px; }
  .upload-btn {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    font-size: 13px;
    background: #F3EAFB;
    border: 0.5px solid #DCC8F0;
    border-radius: 10px;
    color: #6B4E94;
    padding: 10px;
    cursor: pointer;
  }
  .preview-row { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .preview-thumb { width: 56px; height: 56px; border-radius: 8px; object-fit: cover; border: 0.5px solid #DCC8F0; }
  .post-btn {
    width: 100%;
    margin-top: 12px;
    background: #B29CDB;
    color: #fff;
    border: none;
    font-weight: bold;
    font-size: 14px;
    border-radius: 999px;
    padding: 11px;
    cursor: pointer;
  }
  .post-btn:disabled { opacity: 0.5; }
  .post-author { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .avatar {
    width: 32px; height: 32px; border-radius: 50%;
    background: #E8CFE0; display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: bold; color: #7A4E6B;
  }
  .post-media img, .post-media video { width: 100%; border-radius: 12px; margin-top: 8px; display: block; }
  .reactions-row { display: flex; gap: 4px; margin-top: 10px; flex-wrap: wrap; }
  .react-btn { background: none; border: none; padding: 4px 8px; cursor: pointer; border-radius: 999px; transition: transform 0.25s cubic-bezier(.34,1.56,.64,1), opacity 0.25s ease; }
  .react-btn span.emoji { font-size: 22px; display: inline-block; transition: transform 0.25s cubic-bezier(.34,1.56,.64,1), opacity 0.25s ease, filter 0.25s ease; }
  .react-btn.selected span.emoji { transform: scale(1.4); filter: drop-shadow(0 2px 5px rgba(178,156,219,0.6)) saturate(1.3); }
  .react-btn.dimmed span.emoji { transform: scale(0.8); opacity: 0.55; filter: grayscale(35%); }
  .comments-box { border-top: 0.5px solid #F0E4EC; margin-top: 10px; padding-top: 8px; }
  .comment-line { font-size: 13px; color: #8A7288; margin: 4px 0; }
  .comment-input-row { display: flex; gap: 6px; margin-top: 8px; }
  .comment-input-row input { flex: 1; }
  .comment-send { background: #B29CDB; color: #fff; border: none; border-radius: 999px; padding: 0 14px; font-size: 13px; cursor: pointer; }
  .loading-text { text-align: center; color: #B39FB0; font-size: 13px; padding: 20px; }

  .post-header-row { display: flex; align-items: center; justify-content: space-between; }
  .post-menu-btn {
    background: none; border: none; font-size: 20px; font-weight: bold;
    color: #B39FB0; cursor: pointer; padding: 4px 8px;
  }
  .dropdown-menu {
    position: absolute; z-index: 1000; background: #fff; border-radius: 10px;
    border: 0.5px solid #DCC8F0; box-shadow: 0 4px 16px rgba(0,0,0,0.18); overflow: hidden;
  }
  .dropdown-menu button {
    display: block; width: 100%; padding: 10px 18px; background: none; border: none;
    font-size: 14px; color: #C0455C; cursor: pointer; white-space: nowrap; text-align: left;
  }
  .media-item { position: relative; margin-top: 8px; }
  .media-item img, .media-item video { margin-top: 0; }
  .media-menu-btn {
    position: absolute; top: 8px; right: 8px; width: 30px; height: 30px; border-radius: 50%;
    background: rgba(0,0,0,0.55); color: #fff; border: none; font-size: 18px; font-weight: bold;
    line-height: 26px; text-align: center; cursor: pointer; z-index: 5;
  }

  /* 登入画面 / Login screen */
  .login-screen {
    position: fixed; inset: 0; z-index: 9999;
    background: #1a1a2e;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: #cbb8e8; text-align: center; padding: 20px;
  }
  .login-screen h1 { font-size: 22px; margin-bottom: 24px; }
  .google-btn {
    background: #fff; color: #333; border: none; border-radius: 999px;
    padding: 12px 28px; font-size: 15px; cursor: pointer;
    display: flex; align-items: center; gap: 10px;
  }
  .login-error { color: #e08a9a; font-size: 13px; margin-top: 16px; }
</style>
</head>
<body>

<!-- 登入画面 / Login screen -->
<div class="login-screen" id="loginScreen">
  <h1>两人的空间</h1>
  <button class="google-btn" id="googleLoginBtn">
    <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84c-.21 1.13-.84 2.09-1.8 2.73v2.27h2.92c1.7-1.57 2.68-3.88 2.68-6.64z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.27c-.8.54-1.83.86-3.04.86-2.34 0-4.32-1.58-5.03-3.71H.96v2.33C2.44 15.98 5.48 18 9 18z"/><path fill="#FBBC05" d="M3.97 10.7c-.18-.54-.28-1.11-.28-1.7s.1-1.16.28-1.7V4.97H.96C.35 6.19 0 7.55 0 9s.35 2.81.96 4.03l3.01-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0 5.48 0 2.44 2.02.96 4.97l3.01 2.33C4.68 5.16 6.66 3.58 9 3.58z"/></svg>
    用 Google 登入 / Sign in with Google
  </button>
  <p class="login-error" id="loginError"></p>
</div>

<div class="container" id="mainContent" style="display:none;">

  <div class="card">
    <textarea id="postContent" rows="3" placeholder="写下这一刻的心情... / Write what's on your mind..."></textarea>
    <div class="upload-row">
      <label class="upload-btn">
        照片 / Photo
        <input type="file" id="photoInput" accept="image/*" multiple style="display:none;">
      </label>
      <label class="upload-btn">
        影片 / Video
        <input type="file" id="videoInput" accept="video/*" style="display:none;">
      </label>
    </div>
    <div class="preview-row" id="previewRow"></div>
    <button class="post-btn" id="postBtn">发布 / Post</button>
  </div>

  <div id="feed">
    <p class="loading-text">载入中... / Loading...</p>
  </div>

</div>

<!-- Firebase SDK -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import {
  getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut
} from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
import {
  getFirestore, collection, addDoc, getDocs, doc, deleteDoc, setDoc, getDoc, updateDoc,
  query, orderBy, serverTimestamp, onSnapshot
} from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";
import {
  getStorage, ref, uploadBytes, getDownloadURL, deleteObject
} from "https://www.gstatic.com/firebasejs/10.13.0/firebase-storage.js";

const firebaseConfig = {
  apiKey: "AIzaSyCH6KWeqZtoDn0rhKdF3-HnTAuq838MJIE",
  authDomain: "lowandfum.firebaseapp.com",
  projectId: "lowandfum",
  storageBucket: "lowandfum.firebasestorage.app",
  messagingSenderId: "746398053899",
  appId: "1:746398053899:web:e4005aac24c5e5c472f90e"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const storage = getStorage(app);

const ALLOWED_USERS = ["kiwilow1986@gmail.com", "cherylfum@gmail.com"];
const DISPLAY_NAMES = { "kiwilow1986@gmail.com": "Mr Low", "cherylfum@gmail.com": "Ms Fum" };
const EMOJI_MAP = { Love: "❤️", Like: "👍", Support: "💪", Hug: "🤗", Angry: "😡" };

let currentUser = null;
let pendingMedia = []; // { file, type, previewUrl }

function displayName(email) { return DISPLAY_NAMES[email] || email; }

// ===== 登入 / Login =====
document.getElementById('googleLoginBtn').onclick = function() {
  const provider = new GoogleAuthProvider();
  signInWithPopup(auth, provider).catch(function(err) {
    document.getElementById('loginError').textContent = '登入失败 / Login failed: ' + err.message;
  });
};

onAuthStateChanged(auth, function(user) {
  if (user && ALLOWED_USERS.indexOf(user.email) !== -1) {
    currentUser = user;
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('mainContent').style.display = 'block';
    loadFeed();
  } else if (user) {
    document.getElementById('loginError').textContent = '这个账号不在允许名单里 / This account is not authorized';
    signOut(auth);
  } else {
    document.getElementById('loginScreen').style.display = 'flex';
    document.getElementById('mainContent').style.display = 'none';
  }
});

// ===== 上传照片/影片预览 / Photo & video selection =====
document.getElementById('photoInput').addEventListener('change', function(e) {
  handleFiles(e.target.files, 'Photo');
});
document.getElementById('videoInput').addEventListener('change', function(e) {
  handleFiles(e.target.files, 'Video');
});
function handleFiles(files, type) {
  for (let i = 0; i < files.length; i++) {
    const file = files[i];
    pendingMedia.push({ file: file, type: type, previewUrl: URL.createObjectURL(file) });
  }
  renderPreviews();
}
function renderPreviews() {
  const row = document.getElementById('previewRow');
  row.innerHTML = '';
  pendingMedia.forEach(function(m) {
    const img = document.createElement('img');
    img.className = 'preview-thumb';
    img.src = m.previewUrl;
    row.appendChild(img);
  });
}

// ===== 发布帖子 / Submit a post =====
document.getElementById('postBtn').onclick = async function() {
  const content = document.getElementById('postContent').value.trim();
  if (!content && pendingMedia.length === 0) return;

  const btn = document.getElementById('postBtn');
  btn.disabled = true;
  btn.textContent = '发布中... / Posting...';

  try {
    const mediaList = [];
    for (const m of pendingMedia) {
      const ext = m.file.name.split('.').pop();
      const path = 'media/' + Date.now() + '_' + Math.floor(Math.random()*10000) + '.' + ext;
      const storageRef = ref(storage, path);
      await uploadBytes(storageRef, m.file);
      const url = await getDownloadURL(storageRef);
      mediaList.push({ url: url, type: m.type, path: path });
    }

    await addDoc(collection(db, 'posts'), {
      author: currentUser.email,
      content: content,
      media: mediaList,
      timestamp: serverTimestamp()
    });

    document.getElementById('postContent').value = '';
    pendingMedia = [];
    renderPreviews();
  } catch (err) {
    alert('发布失败 / Failed: ' + err.message);
  }
  btn.disabled = false;
  btn.textContent = '发布 / Post';
};

// ===== 载入动态消息 / Load the feed =====
function loadFeed() {
  const q = query(collection(db, 'posts'), orderBy('timestamp', 'desc'));
  onSnapshot(q, function(snapshot) {
    const feed = document.getElementById('feed');
    if (snapshot.empty) {
      feed.innerHTML = '<p class="loading-text">还没有帖子，写下第一篇吧 / No posts yet</p>';
      return;
    }
    feed.innerHTML = '';
    snapshot.forEach(function(docSnap) {
      feed.appendChild(buildPostCard(docSnap.id, docSnap.data()));
    });
  });
}

function buildPostCard(postId, post) {
  const card = document.createElement('div');
  card.className = 'card';
  const authorName = displayName(post.author);
  const initial = authorName.charAt(0).toUpperCase();

  card.innerHTML =
    '<div class="post-header-row">' +
      '<div class="post-author">' +
        '<div class="avatar">' + initial + '</div>' +
        '<div><strong style="font-size:13px;">' + authorName + '</strong></div>' +
      '</div>' +
      '<button class="post-menu-btn" id="postMenuBtn-' + postId + '">⋯</button>' +
    '</div>' +
    '<p style="font-size:14px; margin:0 0 4px; white-space:pre-wrap;">' + escapeHtml(post.content || '') + '</p>' +
    '<div class="post-media" id="media-' + postId + '"></div>' +
    '<div class="reactions-row" id="react-' + postId + '"></div>' +
    '<div class="comments-box">' +
      '<div id="comments-' + postId + '"></div>' +
      '<div class="comment-input-row">' +
        '<input type="text" placeholder="写留言... / Write a comment..." id="commentInput-' + postId + '">' +
        '<button class="comment-send" onclick="window.submitComment(\'' + postId + '\')">送出</button>' +
      '</div>' +
    '</div>';

  card.querySelector('#postMenuBtn-' + postId).onclick = function(e) {
    e.stopPropagation();
    showDropdownMenu(e.currentTarget, [
      { label: '🗑 删除帖子 / Delete post', onClick: function() { deletePost(postId, post); } }
    ]);
  };

  const mediaBox = card.querySelector('#media-' + postId);
  (post.media || []).forEach(function(m, idx) {
    const wrap = document.createElement('div');
    wrap.className = 'media-item';

    if (m.type === 'Video') {
      const v = document.createElement('video');
      v.src = m.url; v.controls = true;
      wrap.appendChild(v);
    } else {
      const img = document.createElement('img');
      img.src = m.url;
      wrap.appendChild(img);
    }

    const menuBtn = document.createElement('button');
    menuBtn.className = 'media-menu-btn';
    menuBtn.innerHTML = '⋯';
    menuBtn.onclick = function(e) {
      e.stopPropagation();
      showDropdownMenu(menuBtn, [
        { label: '🗑 删除照片/影片 / Delete photo', onClick: function() { deleteMediaItem(postId, post, m); } }
      ]);
    };
    wrap.appendChild(menuBtn);

    mediaBox.appendChild(wrap);
  });

  renderReactions(postId, card.querySelector('#react-' + postId));
  loadComments(postId, card.querySelector('#comments-' + postId));

  return card;
}

// 通用的小选单（点旁边空白处会自动关闭）
// A generic small dropdown menu (auto-closes when you tap elsewhere)
function showDropdownMenu(anchorBtn, items) {
  const existing = document.getElementById('dropdownMenu');
  if (existing) existing.remove();

  const menu = document.createElement('div');
  menu.id = 'dropdownMenu';
  menu.className = 'dropdown-menu';
  items.forEach(function(item) {
    const btn = document.createElement('button');
    btn.textContent = item.label;
    btn.onclick = function(e) {
      e.stopPropagation();
      menu.remove();
      item.onClick();
    };
    menu.appendChild(btn);
  });
  document.body.appendChild(menu);

  const rect = anchorBtn.getBoundingClientRect();
  menu.style.top = (window.scrollY + rect.bottom + 4) + 'px';
  menu.style.left = Math.max(8, rect.right - menu.offsetWidth) + 'px';

  setTimeout(function() {
    document.addEventListener('click', function closeMenu(e) {
      if (!menu.contains(e.target)) {
        menu.remove();
        document.removeEventListener('click', closeMenu);
      }
    });
  }, 0);
}

// 删除整篇帖子（连带留言、Emoji 反应、照片影片都会一起删掉）
// Delete the whole post (comments, reactions, and its photos/videos all go with it)
async function deletePost(postId, post) {
  if (!confirm('确定要删除这篇帖子吗？删除后无法恢复。\nDelete this post? This cannot be undone.')) return;

  try {
    // 删掉帖子底下的留言 / delete the post's comments
    const commentsSnap = await getDocs(collection(db, 'posts', postId, 'comments'));
    for (const c of commentsSnap.docs) await deleteDoc(c.ref);

    // 删掉帖子底下的 Emoji 反应 / delete the post's reactions
    const reactionsSnap = await getDocs(collection(db, 'posts', postId, 'reactions'));
    for (const r of reactionsSnap.docs) await deleteDoc(r.ref);

    // 删掉照片/影片本身 / delete the actual photo/video files
    for (const m of (post.media || [])) {
      try { await deleteObject(ref(storage, m.path)); } catch (e) { /* 文件可能已经不见了，不影响 / file may already be gone */ }
    }

    // 最后删掉帖子本身 / finally delete the post itself
    await deleteDoc(doc(db, 'posts', postId));
  } catch (err) {
    alert('删除失败 / Delete failed: ' + err.message);
  }
}

// 删除帖子里的其中一张照片/影片（帖子本身留着）
// Delete a single photo/video from a post (the post itself stays)
async function deleteMediaItem(postId, post, mediaItem) {
  if (!confirm('确定要删除这张照片吗？删除后无法恢复。\nDelete this photo? This cannot be undone.')) return;

  try {
    await deleteObject(ref(storage, mediaItem.path));
    const updatedMedia = (post.media || []).filter(function(m) { return m.path !== mediaItem.path; });
    await updateDoc(doc(db, 'posts', postId), { media: updatedMedia });
  } catch (err) {
    alert('删除失败 / Delete failed: ' + err.message);
  }
}

// ===== Emoji 反应 / Reactions =====
function renderReactions(postId, box) {
  box.innerHTML = '';
  Object.keys(EMOJI_MAP).forEach(function(type) {
    const btn = document.createElement('button');
    btn.className = 'react-btn';
    btn.dataset.type = type;
    btn.innerHTML = '<span class="emoji">' + EMOJI_MAP[type] + '</span>';
    btn.onclick = function() { toggleReaction(postId, type, box); };
    box.appendChild(btn);
  });

  const reactionRef = doc(db, 'posts', postId, 'reactions', currentUser.uid);
  getDoc(reactionRef).then(function(snap) {
    applySelectedState(box, snap.exists() ? snap.data().emojiType : null);
  });
}

async function toggleReaction(postId, emojiType, box) {
  const reactionRef = doc(db, 'posts', postId, 'reactions', currentUser.uid);
  const snap = await getDoc(reactionRef);
  const already = snap.exists() && snap.data().emojiType === emojiType;
  if (already) {
    await deleteDoc(reactionRef);
    applySelectedState(box, null);
  } else {
    await setDoc(reactionRef, { emojiType: emojiType, author: currentUser.email });
    applySelectedState(box, emojiType);
    playPopSound();
  }
}

// 选中 Emoji 时的小音效——用 Web Audio 直接合成，不用另外载音乐文件
// A short "pop" sound for when an emoji is selected — synthesized directly
// via Web Audio, no separate sound file needed
let audioCtx = null;
function playPopSound() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(600, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(900, audioCtx.currentTime + 0.08);
    gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.15);
  } catch (e) {
    // 有些浏览器可能不支援，忽略就好，不影响其他功能
    // Some browsers may not support this — ignore, doesn't affect anything else
  }
}

function applySelectedState(box, selectedType) {
  Array.from(box.querySelectorAll('.react-btn')).forEach(function(b) {
    b.classList.remove('selected', 'dimmed');
    if (selectedType) {
      if (b.dataset.type === selectedType) b.classList.add('selected');
      else b.classList.add('dimmed');
    }
  });
}

// ===== 留言 / Comments =====
function loadComments(postId, box) {
  const q = query(collection(db, 'posts', postId, 'comments'), orderBy('timestamp', 'asc'));
  onSnapshot(q, function(snapshot) {
    box.innerHTML = '';
    snapshot.forEach(function(docSnap) {
      const c = docSnap.data();
      const line = document.createElement('p');
      line.className = 'comment-line';
      line.textContent = displayName(c.author) + ': ' + c.content;
      box.appendChild(line);
    });
  });
}

window.submitComment = async function(postId) {
  const input = document.getElementById('commentInput-' + postId);
  const content = input.value.trim();
  if (!content) return;
  input.value = '';
  await addDoc(collection(db, 'posts', postId, 'comments'), {
    author: currentUser.email,
    content: content,
    timestamp: serverTimestamp()
  });
};

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}
</script>
</body>
</html>
