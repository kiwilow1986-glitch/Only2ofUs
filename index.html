<!DOCTYPE html>
<!--
  LOWandFUM — 两人的空间
  ======================
  用 Firebase 重新做的版本：登入、发帖、照片/影片上传都改用
  Firebase 的 Authentication / Firestore / Storage，取代原本
  Google Apps Script 那套。
  Rebuilt on Firebase: login, posting, and photo/video uploads now
  use Firebase Authentication / Firestore / Storage instead of the
  original Google Apps Script setup.
-->
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>两人的空间</title>

<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="两人的空间">
<meta name="theme-color" content="#14131A">

<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(1.5px 1.5px at 15% 8%, rgba(255,255,255,0.9), transparent),
      radial-gradient(1px 1px at 32% 18%, rgba(255,255,255,0.7), transparent),
      radial-gradient(1.5px 1.5px at 68% 5%, rgba(255,255,255,0.8), transparent),
      radial-gradient(1px 1px at 82% 22%, rgba(255,255,255,0.6), transparent),
      radial-gradient(1.5px 1.5px at 45% 35%, rgba(255,255,255,0.7), transparent),
      radial-gradient(1px 1px at 12% 45%, rgba(255,255,255,0.5), transparent),
      radial-gradient(1.5px 1.5px at 90% 55%, rgba(255,255,255,0.8), transparent),
      radial-gradient(1px 1px at 25% 62%, rgba(255,255,255,0.6), transparent),
      radial-gradient(1.5px 1.5px at 58% 75%, rgba(255,255,255,0.7), transparent),
      radial-gradient(1px 1px at 78% 85%, rgba(255,255,255,0.5), transparent),
      radial-gradient(1.5px 1.5px at 10% 92%, rgba(255,255,255,0.6), transparent),
      radial-gradient(1px 1px at 95% 95%, rgba(255,255,255,0.5), transparent),
      #14131A;
    background-attachment: fixed;
    font-family: 'Georgia', 'Noto Serif SC', 'PingFang SC', serif;
    color: #E8E3D8;
    position: relative;
  }
  /* 小小的弯月，固定在画面右上角 / a small crescent moon, fixed in the upper-right */
  body::before {
    content: '';
    position: fixed;
    top: 24px; right: 28px;
    width: 26px; height: 26px;
    border-radius: 50%;
    background: #E8DCC0;
    box-shadow: -8px 2px 0 0 #14131A;
    opacity: 0.85;
    z-index: 0;
    pointer-events: none;
  }
  }
  .container {
    max-width: 480px;
    margin: 0 auto;
    padding: 16px;
    padding-bottom: 60px;
  }
  .card {
    position: relative;
    background: rgba(40,38,48,0.92);
    border-radius: 16px;
    border: 0.5px solid #3A3540;
    padding: 14px;
    margin-bottom: 14px;
  }
  textarea, input[type="text"] {
    width: 100%;
    border: 0.5px solid #3A3540;
    border-radius: 10px;
    padding: 10px;
    font-size: 16px;
    font-family: inherit;
    background: #221F29;
    color: #E8E3D8;
    resize: none;
  }
  .upload-row { display: flex; gap: 8px; margin-top: 10px; }
  .upload-btn {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    font-size: 13px;
    background: #221F29;
    border: 0.5px solid #3A3540;
    border-radius: 10px;
    color: #B8935F;
    padding: 10px;
    cursor: pointer;
  }
  .preview-row { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .preview-thumb { width: 56px; height: 56px; border-radius: 8px; object-fit: cover; border: 0.5px solid #DCC8F0; }
  .post-btn {
    width: 100%;
    margin-top: 12px;
    background: #B8935F;
    color: #1C1B23;
    border: none;
    font-weight: bold;
    font-size: 14px;
    border-radius: 999px;
    padding: 11px;
    cursor: pointer;
  }
  .post-btn:disabled { opacity: 0.5; }
  .post-author { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .avatar {
    width: 32px; height: 32px; border-radius: 50%;
    background: #3A3540; display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: bold; color: #B8935F;
  }
  .post-media img, .post-media video { width: 100%; border-radius: 12px; margin-top: 8px; display: block; }
  .post-media.multi-media {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    -webkit-overflow-scrolling: touch;
    padding-bottom: 4px;
  }
  .post-media.multi-media .media-item {
    flex: 0 0 82%;
    aspect-ratio: 4 / 5;
    scroll-snap-align: start;
    margin-top: 8px;
  }
  .post-media.multi-media .media-item img,
  .post-media.multi-media .media-item video { width: 100%; height: 100%; object-fit: cover; }
  .reactions-row { display: flex; gap: 4px; margin-top: 10px; flex-wrap: wrap; }
  /* 已读标记：帖子右下角的小字「XX 看过了 ✓」 / Seen marker: small "XX saw this ✓" at the post's bottom-right */
  .seen-row { text-align: right; font-size: 11px; color: rgba(184,147,95,0.8); margin-top: 3px; min-height: 0; letter-spacing: 0.3px; }
  .seen-row:empty { display: none; }
  .react-btn { background: none; border: none; padding: 4px 8px; cursor: pointer; border-radius: 999px; transition: padding 0.25s ease, opacity 0.25s ease, margin 0.25s ease; }
  .react-btn span.emoji { width: 26px; height: 26px; display: inline-block; transition: width 0.25s cubic-bezier(.34,1.56,.64,1), height 0.25s cubic-bezier(.34,1.56,.64,1), opacity 0.25s ease, filter 0.25s ease; }
  .react-btn span.emoji img { width: 100%; height: 100%; object-fit: contain; display: block; pointer-events: none; }
  .react-btn.selected span.emoji { width: 36px; height: 36px; filter: drop-shadow(0 2px 5px rgba(184,147,95,0.6)) saturate(1.3); }

  /* 每个表情各自不同的小动作，点选时播放一次 */
  /* Each emoji gets its own little flourish, played once on tap */
  @keyframes anim-fly-spin {
    0% { transform: translateY(0) rotate(0deg) scale(1); }
    55% { transform: translateY(-34px) rotate(300deg) scale(1.3); }
    100% { transform: translateY(-4px) rotate(360deg) scale(1); }
  }
  @keyframes anim-nod {
    0%, 100% { transform: rotate(0deg); }
    30% { transform: rotate(-18deg); }
    55% { transform: rotate(10deg); }
    75% { transform: rotate(-6deg); }
  }
  @keyframes anim-flex {
    0%, 100% { transform: scale(1); }
    45% { transform: scale(1.55); }
    70% { transform: scale(0.95); }
  }
  @keyframes anim-wobble {
    0%, 100% { transform: rotate(0deg); }
    25% { transform: rotate(-14deg); }
    50% { transform: rotate(0deg); }
    75% { transform: rotate(14deg); }
  }
  @keyframes anim-shake {
    0%, 100% { transform: translateX(0) rotate(0deg); }
    20% { transform: translateX(-4px) rotate(-9deg); }
    40% { transform: translateX(4px) rotate(9deg); }
    60% { transform: translateX(-4px) rotate(-9deg); }
    80% { transform: translateX(4px) rotate(9deg); }
  }
  .react-anim-Love { animation: anim-fly-spin 0.9s ease; }
  .react-anim-Like { animation: anim-nod 0.75s ease; }
  .react-anim-Support { animation: anim-flex 0.75s ease; }
  .react-anim-Hug { animation: anim-wobble 0.9s ease; }
  .react-anim-Angry { animation: anim-shake 0.65s ease; }
  @media (prefers-reduced-motion: reduce) {
    .react-anim-Love, .react-anim-Like, .react-anim-Support, .react-anim-Hug, .react-anim-Angry { animation: none; }
  }

  /* 大动作：从左横扫到右，盖过整篇帖子，比较生动活泼 */
  /* Big effect: sweeps from left to right across the whole post — lively and energetic */
  .reaction-burst, .comment-burst {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    z-index: 20;
    overflow: hidden;
  }
  .reaction-burst .burst-main {
    width: 88px;
    height: 88px;
    filter: drop-shadow(0 6px 16px rgba(0,0,0,0.5));
  }
  .reaction-burst .burst-main img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .comment-burst span {
    font-size: 88px;
    filter: drop-shadow(0 6px 16px rgba(0,0,0,0.5));
  }
  /* 背景那层半透明的"意象闪烁"，跟主动作同时出现，但不跟着动作移动 */
  /* The translucent background flicker — plays alongside the main
     animation but stays put, doesn't travel across the card */
  .burst-echo {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 130px;
    height: 130px;
    opacity: 0;
    z-index: -1;
  }
  .burst-echo img { width: 100%; height: 100%; object-fit: contain; display: block; filter: blur(2px); }
  @keyframes flicker-echo {
    0%, 100% { opacity: 0; }
    20% { opacity: 0.4; }
    35% { opacity: 0.1; }
    50% { opacity: 0.35; }
    65% { opacity: 0.08; }
    80% { opacity: 0.3; }
  }
  .burst-Love .burst-echo, .burst-Like .burst-echo, .burst-Support .burst-echo,
  .burst-Hug .burst-echo, .burst-Angry .burst-echo {
    animation: flicker-echo 1.1s ease forwards;
  }
  @keyframes sweep-love {
    0% { transform: translate(-120%, 40%) scale(0.5) rotate(-20deg); opacity: 0; }
    15% { opacity: 1; }
    35% { transform: translate(-40%, -60%) scale(1.2) rotate(120deg); }
    60% { transform: translate(45%, 30%) scale(1.3) rotate(240deg); }
    85% { opacity: 1; }
    100% { transform: translate(130%, -55%) scale(0.6) rotate(400deg); opacity: 0; }
  }
  @keyframes sweep-like {
    0% { transform: translate(-120%, -45%) scale(0.5) rotate(0deg); opacity: 0; }
    15% { opacity: 1; }
    32% { transform: translate(-35%, 45%) scale(1.2) rotate(-14deg); }
    55% { transform: translate(35%, -35%) scale(1.25) rotate(10deg); }
    72% { transform: translate(-5%, 25%) scale(1.15) rotate(-8deg); }
    85% { opacity: 1; }
    100% { transform: translate(125%, -25%) scale(0.6) rotate(0deg); opacity: 0; }
  }
  @keyframes sweep-support {
    0% { transform: translate(10%, 125%) scale(0.5); opacity: 0; }
    15% { opacity: 1; }
    40% { transform: translate(-35%, -15%) scale(1.5); }
    62% { transform: translate(30%, 15%) scale(1.2); }
    85% { opacity: 1; }
    100% { transform: translate(-10%, -130%) scale(0.6); opacity: 0; }
  }
  @keyframes sweep-hug {
    0% { transform: translate(-110%, 0%) scale(0.5) rotate(0deg); opacity: 0; }
    15% { opacity: 1; }
    32% { transform: translate(-45%, -65%) scale(1.2) rotate(-20deg); }
    52% { transform: translate(25%, -30%) scale(1.25) rotate(20deg); }
    72% { transform: translate(50%, 45%) scale(1.15) rotate(-15deg); }
    85% { opacity: 1; }
    100% { transform: translate(115%, 85%) scale(0.6) rotate(0deg); opacity: 0; }
  }
  @keyframes sweep-angry {
    0% { transform: translate(-115%, -35%) scale(0.5); opacity: 0; }
    15% { opacity: 1; }
    27% { transform: translate(-60%, 45%) scale(1.3) rotate(-15deg); }
    38% { transform: translate(-40%, -45%) scale(1.3) rotate(15deg); }
    49% { transform: translate(-5%, 35%) scale(1.3) rotate(-15deg); }
    60% { transform: translate(25%, -35%) scale(1.3) rotate(15deg); }
    71% { transform: translate(50%, 25%) scale(1.3) rotate(-15deg); }
    85% { opacity: 1; }
    100% { transform: translate(120%, -65%) scale(0.6) rotate(0deg); opacity: 0; }
  }
  @keyframes sweep-comment {
    0% { transform: translateX(-130%) scale(0.5) rotate(-15deg); opacity: 0; }
    15% { opacity: 1; }
    50% { transform: translateX(0) scale(1.25) rotate(10deg); opacity: 1; }
    85% { opacity: 1; }
    100% { transform: translateX(130%) scale(0.6) rotate(20deg); opacity: 0; }
  }
  .burst-Love .burst-main { animation: sweep-love 1.2s ease forwards; }
  .burst-Like .burst-main { animation: sweep-like 1.2s ease forwards; }
  .burst-Support .burst-main { animation: sweep-support 1.2s ease forwards; }
  .burst-Hug .burst-main { animation: sweep-hug 1.3s ease forwards; }
  .burst-Angry .burst-main { animation: sweep-angry 1.1s ease forwards; }
  .comment-burst span { animation: sweep-comment 1s ease forwards; }
  @media (prefers-reduced-motion: reduce) {
    .reaction-burst, .comment-burst { display: none; }
  }
  /* 表情飛到帖子正中間、播放完整動畫影片，播完再飛回原位 */
  /* The emoji flies to the center of the post, plays its full master
     animation video, then flies back to where it started */
  .fly-overlay {
    position: fixed;
    left: 0; top: 0;
    pointer-events: none;
    z-index: 999;
    will-change: transform, opacity;
    transform-origin: center center;
    background: transparent;
    border-radius: 6px;
    overflow: hidden;
  }
  .fly-overlay canvas {
    width: 100%; height: 100%;
    object-fit: contain;
    display: block;
  }
  .video-pool { position: fixed; left: -9999px; top: -9999px; width: 1px; height: 1px; overflow: hidden; }
  .react-btn.flying-source { opacity: 0.15; }
  .react-btn.dimmed { padding: 2px 3px; margin: 0 -2px; }
  .react-btn.dimmed span.emoji { width: 18px; height: 18px; opacity: 0.55; filter: grayscale(35%); }
  .comments-box { border-top: 0.5px solid #3A3540; margin-top: 10px; padding-top: 8px; }
  .comment-block { margin: 0 0 8px; }
  .comment-line { font-size: 13px; color: #A89A8C; margin: 4px 0; white-space: pre-wrap; }
  /* 留言下方的 Emoji 反应，尺寸比帖子本身的反应小一圈 */
  /* Comment-level emoji reactions, a size smaller than the post's own reactions */
  .comment-reactions-row { display: flex; gap: 2px; margin: 2px 0 0; flex-wrap: wrap; align-items: center; }
  .comment-reactions-row .react-btn { padding: 2px 5px; }
  .comment-reactions-row .react-btn span.emoji { width: 16px; height: 16px; }
  .comment-reactions-row .react-btn.selected span.emoji { width: 22px; height: 22px; }
  .comment-reactions-row .react-btn.dimmed { padding: 1px 2px; margin: 0 -1px; }
  .comment-reactions-row .react-btn.dimmed span.emoji { width: 10px; height: 10px; }
  @keyframes comment-pop-in {
    0% { opacity: 0; transform: translateY(10px) scale(0.9); }
    60% { opacity: 1; transform: translateY(-2px) scale(1.03); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }
  .comment-line.comment-new { animation: comment-pop-in 0.4s ease; }
  @media (prefers-reduced-motion: reduce) {
    .comment-line.comment-new { animation: none; }
  }
  .comment-send.just-sent { animation: anim-flex 0.4s ease; }
  .comment-input-row { display: flex; gap: 6px; margin-top: 8px; align-items: flex-end; }
  .comment-input-row textarea {
    flex: 1; resize: none; min-height: 38px; max-height: 120px;
  }
  .comment-send { background: #B8935F; color: #1C1B23; border: none; border-radius: 999px; padding: 0 14px; font-size: 13px; cursor: pointer; }
  .loading-text { text-align: center; color: #6B6560; font-size: 13px; padding: 20px; }

  .post-header-row { display: flex; align-items: center; justify-content: space-between; }
  .post-menu-btn {
    background: none; border: none; font-size: 20px; font-weight: bold;
    color: #B39FB0; cursor: pointer; padding: 4px 8px;
  }
  .dropdown-menu {
    position: absolute; z-index: 1000; background: #221F29; border-radius: 10px;
    border: 0.5px solid #3A3540; box-shadow: 0 4px 16px rgba(0,0,0,0.4); overflow: hidden;
  }
  .dropdown-menu button {
    display: block; width: 100%; padding: 10px 18px; background: none; border: none;
    font-size: 14px; color: #E08A8A; cursor: pointer; white-space: nowrap; text-align: left;
  }
  .media-item { position: relative; margin-top: 8px; }
  .media-item img, .media-item video { margin-top: 0; }
  .media-menu-btn {
    position: absolute; bottom: 8px; right: 8px; width: 30px; height: 30px; border-radius: 50%;
    background: rgba(0,0,0,0.55); color: #fff; border: none; font-size: 18px; font-weight: bold;
    line-height: 26px; text-align: center; cursor: pointer; z-index: 5;
  }

  /* 登入画面 / Login screen */
  .login-screen {
    position: fixed; inset: 0; z-index: 9999;
    background: #14131A;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: #C9B896; text-align: center; padding: 20px;
  }
  .login-screen h1 { font-size: 22px; margin-bottom: 24px; }
  .google-btn {
    background: #fff; color: #333; border: none; border-radius: 999px;
    padding: 12px 28px; font-size: 15px; cursor: pointer;
    display: flex; align-items: center; gap: 10px;
  }
  .login-error { color: #e08a9a; font-size: 13px; margin-top: 16px; }

  .tap-enter-screen {
    position: fixed; inset: 0; z-index: 9998;
    background: #14131A;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: #C9B896; text-align: center; cursor: pointer;
    transition: opacity 0.6s ease;
  }
  .tap-enter-screen.hidden { opacity: 0; pointer-events: none; }
  .tap-enter-screen h1 { font-size: 22px; }
  .tap-enter-screen p { font-size: 14px; animation: tap-pulse 1.6s ease-in-out infinite; }
  @keyframes tap-pulse { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }

  /* ===== 开场影片 / Opening intro video =====
     影片固定在画面最上方当背景：先播放一次开场，播完停在最后一格，
     那两行字就留在原位。帖子从字的下方 2mm 开始。
     The video stays pinned to the top as the background: it plays once
     as the opening, then rests on its last frame so the two title lines
     stay exactly where they landed. Posts begin 2mm below the title. */
  :root {
    --stage-w: min(100vw, 480px);
    /* 新影片 1080x2340（19.5:9，iPhone全屏比例）；标题底部在 y=405 */
    /* the new video is 1080x2340 (19.5:9, iPhone full-screen); the title's bottom edge is at y=405 */
    --title-h: calc(var(--stage-w) * 0.368);
    --safe-top: env(safe-area-inset-top, 0px);
  }
  .intro-stage {
    position: fixed; inset: 0; z-index: 1; display: none;
    background: #14131A; overflow: hidden;
    /* 纯装饰背景，不接受任何点击，点到也不会有反应 / purely decorative — never receives taps */
    pointer-events: none;
    transition: opacity 0.5s ease, visibility 0.5s;
  }
  .intro-stage.active { display: block; }
  /* 开始看post后（scroll下去）：大字影片和定格背景淡出，
     换成同一个日落场景「没有字」的版本留在post后面
     Scrolling into the posts: the big-title video and its settled
     backdrop fade out, replaced by the same sunset scene WITHOUT the
     title, which stays behind the posts */
  .intro-frame { transition: opacity 0.3s ease; }
  .intro-backdrop { transition: opacity 0.6s ease; }
  body.compact .intro-frame { opacity: 0; }
  body.compact .intro-backdrop { opacity: 0; }
  .backdrop-posts {
    position: absolute; top: var(--safe-top); bottom: 0; left: 0; right: 0;
    margin: 0 auto; width: var(--stage-w);
    background: url("BG_POSTS.jpg") top center / 100% auto no-repeat #14131A;
    /* 稍微调暗一点点，post上的字才清楚 / very slightly dimmed so the posts stay easy to read */
    filter: brightness(0.9);
    opacity: 0; transition: opacity 0.6s ease;
  }
  body.compact .backdrop-posts { opacity: 1; }
  .intro-backdrop {
    /* 影片播放中，下方延伸区先调暗；影片定格后才亮起来无缝衔接
       While the video is playing, the extended area below stays dimmed;
       it brightens to blend seamlessly once the video settles */
    transition: filter 0.9s ease, opacity 0.6s ease;
    filter: brightness(0.5) saturate(0.95);
    /* 影片下方用「花海往下延伸」的图片补满整个屏幕，宽度和影片完全对齐，
       所以影片的最后一格会和这张图无缝接在一起，看起来就是全屏背景。
       Below the video, this extended-meadow image fills the rest of the
       screen. It's exactly as wide as the video, and its top part IS the
       video's last frame, so the two join seamlessly into one
       full-screen background. */
    position: absolute; top: var(--safe-top); bottom: 0; left: 0; right: 0;
    margin: 0 auto; width: var(--stage-w);
    /* 影片比例就是手机全屏比例，不再需要往下补接花海延伸图
       The video's own ratio IS the phone's full-screen ratio now, so no
       more extension image stitched on below */
    background: url("INTRO_END.jpg") top center / 100% auto no-repeat #14131A;
  }
  .intro-frame {
    position: absolute; top: var(--safe-top); left: 0; right: 0;
    margin: 0 auto; width: var(--stage-w);
  }
  .intro-frame video, .intro-frame img {
    display: block; width: 100%; height: auto; aspect-ratio: 1080 / 2340;
  }
  .intro-frame img { position: absolute; top: 0; left: 0; display: none; }
  .intro-stage.settled .intro-backdrop { filter: none; }

  /* 收起时的上方窗口：逐帧图片跟着scroll进度换，窗口同步缩短成横幅
     The top window while collapsing: frame images swap with the scroll
     progress while the window shortens into a slim banner */
  :root {
    --compact-h: calc(var(--stage-w) * 0.361);
  }
  .compact-header {
    position: fixed; top: 0; left: 0; right: 0; z-index: 2;
    margin: 0 auto; width: var(--stage-w);
    padding-top: var(--safe-top);
    background: #14131A;
    opacity: 0; visibility: hidden; pointer-events: none;
    transition: opacity 0.3s ease, visibility 0.3s;

  document.head.appendChild(st);
})();

    function tsUrl(i) { return window.THEME.framesDir + '/TS_' + (i < 10 ? '0' : '') + i + '.webp'; }

    const preloadedFrames = [];

    function setFrame(url, idx) {
      if (idx === lastFrameIdx) return;
      lastFrameIdx = idx;
      strip.src = url;
    }

    function applyScroll() {
      rafPending = false;
      const pl = Math.min(1, Math.max(0, main.scrollTop / SCRUB_RANGE));
      if (pl > 0 && !headerActive) activateHeader();

      // 真的滑下去过一半，才算「离开过顶部」——避免手指刚碰到的第一下
      // (scrollTop=1~2) 就被误判成「回到顶部」而触发放大
      // Only counts as having left the top after scrolling past halfway —
      // so the very first touch (scrollTop=1-2) can't be mistaken for a
      // "return to the top" and trigger the grow by accident
      if (pl >= 0.5) hasLeftTop = true;

      const W = stageWpx();
      band.style.height = lerp(BAND_FULL_FRAC, COMPACT_FRAC, pl) * W + 'px';
      const fullFrac = layoutBig ? BIG_FRAC : SMALL_FRAC;
      main.style.top = (safeTopPx() + lerp(fullFrac, COMPACT_FRAC, pl) * W + MM2) + 'px';

      if (pl > 0.5) document.body.classList.add('compact');
      else document.body.classList.remove('compact');

      // 展开动画途中又往下滑：立刻结束动画、交回给手指
      // Scrolled down mid-grow: end the animation and hand control back to the finger
      if (growPlaying && main.scrollTop > 6) finishFirstGrow(true);

      // 字的大小 = scroll进度（第一次放大完成后启用）
      // Title size = scroll progress (active once the first grow has run)
      if (firstCycleDone && !growPlaying) {
        const idx = Math.round(pl * (N_FRAMES - 1));
        setFrame(tsUrl(idx), idx);
      }

      // 第一次回到最顶：播一次「字放大」帧序列（1秒）。
      // 条件：真的下去过（hasLeftTop）而且24张放大帧全部载好（tgReady）
      // First arrival back at the very top: play the grow sequence once (1s).
      // Requires having really scrolled down first AND all 24 grow frames loaded
      if (!firstCycleDone && hasLeftTop && tgReady && !growPlaying && main.scrollTop < 3) {
        growPlaying = true;
        // posts同步让位给变大的字 / the posts make room for the growing title in parallel
        layoutBig = true;
        main.classList.add('ease-top');
        requestAnimationFrame(applyScroll2);
        const t0 = performance.now();
        const DUR = 1000;
        const step = function(now) {
          if (!growPlaying) return;
          const q = Math.min(1, (now - t0) / DUR);
          lastGrowIdx = Math.round(q * (N_FRAMES - 1));
          setFrame(tgUrl(lastGrowIdx), 100 + lastGrowIdx);
          if (q < 1) { growRaf = requestAnimationFrame(step); }
          else { finishFirstGrow(false); }
        };
        growRaf = requestAnimationFrame(step);
      }
    }

    function finishFirstGrow(interrupted) {
      if (firstCycleDone) return;
      firstCycleDone = true;
      growPlaying = false;
      layoutBig = true;
      if (growRaf) { cancelAnimationFrame(growRaf); growRaf = null; }
      if (interrupted) {
        // 被打断：换到跟当前大小最接近的缩字帧，不突然跳图，手指马上接管
        // Interrupted: switch to the shrink frame closest to the current
        // size — no sudden jump — and the finger takes over right away
        main.classList.remove('ease-top');
        const eq = (N_FRAMES - 1) - lastGrowIdx;
        setFrame(tsUrl(eq), eq);
      } else {
        setFrame(tsUrl(0), 0);
        setTimeout(function() { main.classList.remove('ease-top'); }, 450);
      }
      requestAnimationFrame(applyScroll2);
    }
    function applyScroll2() { if (!rafPending) { rafPending = true; requestAnimationFrame(applyScroll); } }

    main.addEventListener('scroll', function() {
      // 手指一动就取消posts的缓动，位置始终跟手 / any real scroll cancels the easing so position always tracks the finger
      if (!growPlaying) main.classList.remove('ease-top');
      applyScroll2();
    }, { passive: true });
    window.addEventListener('resize', applyScroll2);
  }

  video.addEventListener('ended', function() { finish(false); }, { once: true });
  video.addEventListener('error', function() { finish(true); }, { once: true });
  // 用 <source> 列表时，错误会落在最后一个 source 上 / with a <source> list, failures land on the last source
  const introSources = video.querySelectorAll('source');
  if (introSources.length) {
    introSources[introSources.length - 1].addEventListener('error', function() { finish(true); }, { once: true });
  }
  video.addEventListener('play', function() { video.playbackRate = INTRO_PLAYBACK_RATE; });

  // 保险：网络太慢时最多等 15 秒，不会一直卡在开场
  // Safety net: on a slow connection, wait at most 15s rather than hanging on the opening
  const safetyTimer = setTimeout(function() { finish(true); }, 15000);

  video.defaultPlaybackRate = INTRO_PLAYBACK_RATE;
  video.playbackRate = INTRO_PLAYBACK_RATE;
  const playPromise = video.play();
  if (playPromise && playPromise.catch) {
    playPromise.catch(function() { finish(true); });
  }
}

onAuthStateChanged(auth, function(user) {
  if (user && ALLOWED_USERS.indexOf(user.email) !== -1) {
    currentUser = user;
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('tapEnterScreen').style.display = 'flex';

    signOut(auth);
  } else {
    document.getElementById('loginScreen').style.display = 'flex';
    document.getElementById('mainContent').style.display = 'none';
  }
});

function handleFiles(files, type) {

  renderPreviews();
}
function renderPreviews() {
  const row = document.getElementById('previewRow');
  row.innerHTML = '';

// ===== 发布帖子 / Submit a post =====
document.getElementById('postBtn').onclick = async function() {
  const content = document.getElementById('postContent').value.trim();
  if (!content && pendingMedia.length === 0) return;

  const btn = document.getElementById('postBtn');
  btn.disabled = true;
  btn.textContent = '发布中... / Posting...';

  try {
    const mediaList = [];
    for (const m of pendingMedia) {
      const ext = m.file.name.split('.').pop();
      const path = 'media/' + Date.now() + '_' + Math.floor(Math.random()*10000) + '.' + ext;
      const storageRef = ref(storage, path);
      await uploadBytes(storageRef, m.file);
      const url = await getDownloadURL(storageRef);
      mediaList.push({ url: url, type: m.type, path: path });
    }

    await addDoc(collection(db, 'posts'), {
      author: currentUser.email,
      content: content,
      media: mediaList,
      timestamp: serverTimestamp()
    });

    document.getElementById('postContent').value = '';
    pendingMedia = [];
    renderPreviews();
  } catch (err) {
    alert('发布失败 / Failed: ' + err.message);
  }
  btn.disabled = false;
  btn.textContent = '发布 / Post';
};

// ===== 载入动态消息 / Load the feed =====
function loadFeed() {
  const q = query(collection(db, 'posts'), orderBy('timestamp', 'desc'));
  onSnapshot(q, function(snapshot) {
    const feed = document.getElementById('feed');
    if (snapshot.empty) {
      feed.innerHTML = '<p class="loading-text">还没有帖子，写下第一篇吧 / No posts yet</p>';
      return;
    }
    feed.innerHTML = '';
    snapshot.forEach(function(docSnap) {
      feed.appendChild(buildPostCard(docSnap.id, docSnap.data()));
    });
  });
}

// 影片滑到画面 75% 以上就自动播放，滑走就暂停
// Auto-play a video once 75%+ of it is on screen; pause when it scrolls away
const videoAutoplayObserver = (typeof IntersectionObserver !== 'undefined')
  ? new IntersectionObserver(function(entries) {
      entries.forEach(function(entry) {
        if (entry.isIntersecting && entry.intersectionRatio >= 0.75) {
          entry.target.play().catch(function() { /* 有些浏览器可能拒绝，忽略就好 / some browsers may refuse — ignore */ });
        } else {
          entry.target.pause();
        }
      });
    }, { threshold: [0, 0.75, 1] })
  : null;

function observeVideoForAutoplay(videoEl) {
  if (videoAutoplayObserver) videoAutoplayObserver.observe(videoEl);
}

// ===== 已读标记 / Seen markers =====
// 不是作者的那个人把帖子滑到眼前、停留 1.5 秒，就算「看过了」；
// 之后这个帖子的右下角（两边手机都）会显示「Ms Fum 看过了 ✓」或「Mr Low 看过了 ✓」。
// 记录存在 posts/{postId}/seen/{email}，不会触发任何通知。
// When the NON-author scrolls a post into view and it stays there for
// 1.5s, it counts as "seen"; the post's bottom-right then shows
// "Ms Fum 看过了 ✓" / "Mr Low 看过了 ✓" on both phones. Stored at
// posts/{postId}/seen/{email}; never triggers a notification.
const seenUnsubs = {};      // postId -> 取消监听的函数 / unsubscribe function
const seenExists = {};      // postId -> 已经记录过了 / seen doc already exists
const seenWritten = {};     // postId -> 这个 session 已经写过了 / already attempted this session
const seenDwellTimers = {}; // postId -> 停留计时器 / dwell timer

function partnerOf(email) { return ALLOWED_USERS.find(function(e) { return e !== email; }); }

function watchSeen(postId, post) {
  const target = partnerOf(post.author); // 要显示谁的「看过了」 / whose "seen" is shown
  if (!target) return;
  if (seenUnsubs[postId]) seenUnsubs[postId]();
  seenUnsubs[postId] = onSnapshot(doc(db, 'posts', postId, 'seen', target), function(snap) {
    seenExists[postId] = snap.exists();
    const el = document.getElementById('seen-' + postId);
    if (el) el.textContent = snap.exists() ? (displayName(target) + ' 看过了 ✓') : '';
  }, function() { /* 读取失败不影响其他功能 / a failed read shouldn't break anything else */ });
}

const postSeenObserver = (typeof IntersectionObserver !== 'undefined')
  ? new IntersectionObserver(function(entries) {
      entries.forEach(function(entry) {
        const postId = entry.target.dataset.seenPostId;
        if (!postId) return;
        if (entry.isIntersecting && entry.intersectionRatio >= 0.5) {
          if (seenDwellTimers[postId]) return;
          seenDwellTimers[postId] = setTimeout(function() {
            seenDwellTimers[postId] = null;
            if (seenExists[postId] || seenWritten[postId] || !currentUser) return; // 已记录过就不再写 / already recorded
            if (document.visibilityState !== 'visible') return; // app 在后台不算看过 / backgrounded app doesn't count
            seenWritten[postId] = true; // 一个 session 最多写一次 / at most one write attempt per session
            setDoc(doc(db, 'posts', postId, 'seen', currentUser.email), {
              author: currentUser.email,
              at: serverTimestamp()
            }, { merge: true }).catch(function() {});
          }, 1500);
        } else if (seenDwellTimers[postId]) {
          clearTimeout(seenDwellTimers[postId]);
          seenDwellTimers[postId] = null;
        }
      });
    }, { threshold: [0, 0.5, 1] })
  : null;

function observePostForSeen(card, postId, post) {
  watchSeen(postId, post);
  // 只有「不是作者」的人需要被记录 / only the non-author gets recorded
  if (!postSeenObserver || !currentUser || currentUser.email === post.author) return;
  card.dataset.seenPostId = postId;
  postSeenObserver.observe(card);
}

// 帖子（也就是照片/影片上传）的日期时间，例如 2026/11/13 16:28
// The post's (i.e. the photo/video upload's) date and time, e.g. 2026/11/13 16:28
function formatPostDate(post) {
  let d = null;
  if (post.timestamp && typeof post.timestamp.toDate === 'function') {
    d = post.timestamp.toDate();
  } else if ((post.media || []).length && post.media[0].path) {
    // 档案名字开头本来就是上传那一刻的时间 / the file name already begins with the upload moment
    const ms = parseInt(String(post.media[0].path).replace('media/', ''), 10);
    if (ms > 0) d = new Date(ms);
  }
  if (!d) d = new Date(); // 刚发出、伺服器时间还没回来 / just posted, server time not back yet
  const pad = function(n) { return (n < 10 ? '0' : '') + n; };
  return d.getFullYear() + '/' + pad(d.getMonth() + 1) + '/' + pad(d.getDate()) +
    ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
}

// ===== 下载照片/影片到手机 / Save a photo or video to the phone =====
function showSaveToast(html, ms) {
  const old = document.getElementById('saveToast');
  if (old) old.remove();
  const t = document.createElement('div');
  t.id = 'saveToast';
  t.className = 'save-toast';
  t.innerHTML = html;
  document.body.appendChild(t);
  setTimeout(function() { if (t.parentNode) t.remove(); }, ms || 3000);
  return t;
}

async function downloadMediaItem(m) {
  const ext = (String(m.path || '').split('.').pop() || (m.type === 'Video' ? 'mp4' : 'jpg')).toLowerCase();
  const fileName = 'LOWandFUM_' + String(m.path || Date.now()).replace('media/', '').split('.')[0] + '.' + ext;
  showSaveToast('下载中… / Downloading…', 60000);
  try {
    const resp = await fetch(m.url);
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const blob = await resp.blob();
    const file = new File([blob], fileName, { type: blob.type || (m.type === 'Video' ? 'video/mp4' : 'image/jpeg') });

    // 手机：跳出系统的分享/储存选单，可以直接「储存影像/储存影片」到相簿
    // Phones: opens the system share sheet, where "Save Image / Save Video" puts it in Photos
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try {
        await navigator.share({ files: [file] });
        showSaveToast('完成 / Done', 1500);
        return;
      } catch (shareErr) {
        if (shareErr && shareErr.name === 'AbortError') { showSaveToast('已取消 / Cancelled', 1500); return; }
        // 其他情况就改用下面的一般下载 / otherwise fall through to a normal download
      }
    }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = fileName;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function() { URL.revokeObjectURL(a.href); }, 60000);
    showSaveToast('已下载 / Downloaded', 2000);
  } catch (err) {
    // 直接抓档案被挡的时候，给一个连结：点开后长按照片/影片就能储存
    // If fetching the file directly is blocked, offer a link instead:
    // open it, then long-press the photo/video to save
    showSaveToast(
      '<a href="' + m.url + '" target="_blank" rel="noopener">打开原档 / Open original</a><br>' +
      '打开后长按照片或影片 → 储存<br>Then long-press it → Save', 12000);
  }
}

function buildPostCard(postId, post) {
  const card = document.createElement('div');
  card.className = 'card';
  const authorName = displayName(post.author);
  const initial = authorName.charAt(0).toUpperCase();

  card.innerHTML =
    '<div class="post-header-row">' +
      '<div class="post-author">' +
        '<div class="avatar">' + initial + '</div>' +
        '<div><strong style="font-size:13px;">' + authorName + '</strong>' +
          '<div class="post-date">' + formatPostDate(post) + '</div></div>' +
      '</div>' +
      '<button class="post-menu-btn" id="postMenuBtn-' + postId + '">⋯</button>' +
    '</div>' +
    '<p id="content-' + postId + '" style="font-size:14px; margin:0 0 4px; white-space:pre-wrap;">' + escapeHtml(post.content || '') + '</p>' +
    '<div class="post-media" id="media-' + postId + '"></div>' +
    '<div class="reactions-row" id="react-' + postId + '"></div>' +
    '<div class="seen-row" id="seen-' + postId + '"></div>' +
    '<div class="comments-box">' +
      '<div id="comments-' + postId + '"></div>' +
      '<div class="comment-input-row">' +
        '<textarea rows="1" placeholder="写留言... / Write a comment..." id="commentInput-' + postId + '" oninput="this.style.height=\'auto\';this.style.height=this.scrollHeight+\'px\';"></textarea>' +
        '<button class="comment-send" id="commentSend-' + postId + '" onclick="window.submitComment(\'' + postId + '\')">送出</button>' +
      '</div>' +
    '</div>';

  card.querySelector('#postMenuBtn-' + postId).onclick = function(e) {
    e.stopPropagation();
    showDropdownMenu(e.currentTarget, [
      { label: '✏️ 编辑帖子 / Edit post', onClick: function() { startEditPost(postId, post, card); } },
      { label: '🗑 删除帖子 / Delete post', onClick: function() { deletePost(postId, post); } }
    ]);
  };

  const mediaBox = card.querySelector('#media-' + postId);
  if ((post.media || []).length > 1) {
    mediaBox.classList.add('multi-media');
  }
  (post.media || []).forEach(function(m, idx) {
    const wrap = document.createElement('div');
    wrap.className = 'media-item';

    if (m.type === 'Video') {
      const v = document.createElement('video');
      v.src = m.url; v.controls = true;
      v.muted = true;       // 手机规定：滑到自动播放的影片一定要先静音 / mobile browsers require this for scroll-triggered autoplay
      v.playsInline = true; // 让影片在原地播放，不会自动跳成全萤幕 / plays inline instead of jumping to fullscreen on iOS
      v.loop = true;
      wrap.appendChild(v);
      observeVideoForAutoplay(v);
    } else {
      const img = document.createElement('img');
      img.src = m.url;
      wrap.appendChild(img);
    }

    const menuBtn = document.createElement('button');
    menuBtn.className = 'media-menu-btn';
    menuBtn.innerHTML = '⋯';
    menuBtn.onclick = function(e) {
      e.stopPropagation();
      showDropdownMenu(menuBtn, [
        { label: '⬇️ 下载 / Download', onClick: function() { downloadMediaItem(m); } },
        { label: '🗑 删除照片/影片 / Delete photo', onClick: function() { deleteMediaItem(postId, post, m); } }
      ]);
    };
    wrap.appendChild(menuBtn);

    mediaBox.appendChild(wrap);
  });

  renderReactions(postId, card.querySelector('#react-' + postId));
  loadComments(postId, card.querySelector('#comments-' + postId));
  observePostForSeen(card, postId, post);

  return card;
}

// 通用的小选单（点旁边空白处会自动关闭）
// A generic small dropdown menu (auto-closes when you tap elsewhere)
function showDropdownMenu(anchorBtn, items) {
  const existing = document.getElementById('dropdownMenu');
  if (existing) existing.remove();

  const menu = document.createElement('div');
  menu.id = 'dropdownMenu';
  menu.className = 'dropdown-menu';
  items.forEach(function(item) {
    const btn = document.createElement('button');
    btn.textContent = item.label;
    btn.onclick = function(e) {
      e.stopPropagation();
      menu.remove();
      item.onClick();
    };
    menu.appendChild(btn);
  });
  document.body.appendChild(menu);

  const rect = anchorBtn.getBoundingClientRect();
  menu.style.top = (window.scrollY + rect.bottom + 4) + 'px';
  menu.style.left = Math.max(8, rect.right - menu.offsetWidth) + 'px';

  setTimeout(function() {
    document.addEventListener('click', function closeMenu(e) {
      if (!menu.contains(e.target)) {
        menu.remove();
        document.removeEventListener('click', closeMenu);
      }
    });
  }, 0);
}

// 编辑帖子的文字（照片/影片不透过这里改，放错了直接用上面的删除功能）
// Edit a post's text (photos/videos aren't touched here — if one's wrong, just delete it directly)
function startEditPost(postId, post, card) {
  const p = card.querySelector('#content-' + postId);
  if (!p) return;

  const wrap = document.createElement('div');
  wrap.innerHTML =
    '<textarea id="editArea-' + postId + '" rows="3" style="width:100%;">' + escapeHtml(post.content || '') + '</textarea>' +
    '<div style="display:flex; gap:8px; margin-top:6px;">' +
      '<button id="editSave-' + postId + '" style="background:#B8935F; color:#1C1B23; border:none; border-radius:999px; padding:6px 16px; font-size:13px; cursor:pointer;">保存 / Save</button>' +
      '<button id="editCancel-' + postId + '" style="background:none; border:0.5px solid #3A3540; color:#E8E3D8; border-radius:999px; padding:6px 16px; font-size:13px; cursor:pointer;">取消 / Cancel</button>' +
    '</div>';

  p.replaceWith(wrap);

  wrap.querySelector('#editCancel-' + postId).onclick = function() {
    wrap.replaceWith(p);
  };

  wrap.querySelector('#editSave-' + postId).onclick = async function() {
    const newContent = wrap.querySelector('#editArea-' + postId).value.trim();
    try {
      await updateDoc(doc(db, 'posts', postId), { content: newContent });
      post.content = newContent;
      p.textContent = newContent;
      wrap.replaceWith(p);
    } catch (err) {
      alert('保存失败 / Save failed: ' + err.message);
    }
  };
}

// 删除整篇帖子（连带留言、Emoji 反应、照片影片都会一起删掉）
// Delete the whole post (comments, reactions, and its photos/videos all go with it)
async function deletePost(postId, post) {
  if (!confirm('确定要删除这篇帖子吗？删除后无法恢复。\nDelete this post? This cannot be undone.')) return;

  try {
    // 删掉帖子底下的留言 / delete the post's comments
    const commentsSnap = await getDocs(collection(db, 'posts', postId, 'comments'));
    for (const c of commentsSnap.docs) await deleteDoc(c.ref);

    // 删掉帖子底下的 Emoji 反应 / delete the post's reactions
    const reactionsSnap = await getDocs(collection(db, 'posts', postId, 'reactions'));
    for (const r of reactionsSnap.docs) await deleteDoc(r.ref);

    // 删掉已读记录（就算失败也不挡着删帖子）/ delete the seen markers (never block the post delete)
    try {
      const seenSnap = await getDocs(collection(db, 'posts', postId, 'seen'));
      for (const s of seenSnap.docs) await deleteDoc(s.ref);
    } catch (seenErr) { /* ignore */ }

    // 删掉照片/影片本身 / delete the actual photo/video files
    for (const m of (post.media || [])) {
      try { await deleteObject(ref(storage, m.path)); } catch (e) { /* 文件可能已经不见了，不影响 / file may already be gone */ }
    }

    // 最后删掉帖子本身 / finally delete the post itself
    await deleteDoc(doc(db, 'posts', postId));
  } catch (err) {
    alert('删除失败 / Delete failed: ' + err.message);
  }
}

// 删除帖子里的其中一张照片/影片（帖子本身留着）
// Delete a single photo/video from a post (the post itself stays)
async function deleteMediaItem(postId, post, mediaItem) {
  if (!confirm('确定要删除这张照片吗？删除后无法恢复。\nDelete this photo? This cannot be undone.')) return;

  try {
    await deleteObject(ref(storage, mediaItem.path));
    const updatedMedia = (post.media || []).filter(function(m) { return m.path !== mediaItem.path; });
    await updateDoc(doc(db, 'posts', postId), { media: updatedMedia });
  } catch (err) {
    alert('删除失败 / Delete failed: ' + err.message);
  }
}

// ===== Emoji 反应 / Reactions =====
// ---- 預先把 5 個 MASTER 影片都準備好，各自可以借出多份 ----
// ---- 避免兩篇貼文同時用同一種表情時互相搶用同一個 <video> ----
// Prepares all 5 MASTER videos ahead of time. Each type keeps a small
// pool of reusable <video> elements, so two different posts reacting
// with the SAME emoji type at the same time don't fight over one
// shared element. The <video> itself always stays hidden off-screen —
// what's actually shown on screen is a <canvas> that redraws every
// frame with the video's black backdrop made transparent. This works
// everywhere, unlike CSS mix-blend-mode on a <video>, which some
// mobile browsers don't apply correctly.
const videoPoolEl = document.getElementById('videoPool');
const videoElementsPool = {};
Object.keys(VIDEO_MAP).forEach(function(type) { videoElementsPool[type] = []; });

function createPooledVideo(type) {
  const v = document.createElement('video');
  v.src = VIDEO_MAP[type];
  v.muted = true;
  v.playsInline = true;
  v.setAttribute('playsinline', '');
  v.preload = 'auto';
  v.load();
  videoPoolEl.appendChild(v);
  return v;
}
// 先幫每一種都預先建好、預載一份 / pre-warm one instance per type
Object.keys(VIDEO_MAP).forEach(function(type) { videoElementsPool[type].push(createPooledVideo(type)); });

function acquireVideo(type) {
  const pool = videoElementsPool[type];
  if (pool.length > 0) return pool.pop();
  return createPooledVideo(type); // 不夠用就臨時多建一份 / make an extra one on demand
}
function releaseVideo(type, v) {
  // 影片本來就沒離開過隱藏池，這裡只是標記它「空出來了」可以再借用
  // The video never left the hidden pool — this just marks it free again
  videoElementsPool[type].push(v);
}

// 把影片畫面即時畫到 canvas 上，同時把接近黑色的像素變透明——
// 這就是讓影片自己的黑色背景「消失」、只留下表情本身的關鍵
// Draws each video frame onto a canvas in real time and makes
// near-black pixels transparent — this is what makes the video's own
// black backdrop disappear, leaving only the emoji itself visible
const CHROMA_BLACK_CUTOFF = 18;  // 亮度低於這個值，完全透明 / below this brightness, fully transparent
const CHROMA_FADE_RANGE = 34;    // 再往上這一段做漸層透明，邊緣才不會太鋸齒 / soft-edge fade band above the cutoff

function startChromaKey(flight) {
  const video = flight.video;
  const canvas = flight.canvas;
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  const W = canvas.width, H = canvas.height;

  let lastFrameTime = -1;
  function tick() {
    if (!flight.active) return;
    // 影片一秒約 30 格，畫面一秒刷新 60 次：同一格不重算兩次 / the video runs ~30fps but the screen refreshes at 60 — don't reprocess the same frame twice
    if (video.readyState >= 2 && W > 0 && H > 0 && video.currentTime !== lastFrameTime) {
      lastFrameTime = video.currentTime;
      ctx.drawImage(video, 0, 0, W, H);
      // 在本機直接打開 html 檔案（file://）時，瀏覽器會禁止讀取畫面像素，
      // 黑背景就去不掉——正式網站上沒有這個限制。這裡包一層保護，
      // 就算被禁止也只是背景變黑，動畫照常跑完
      // When the html file is opened directly from disk (file://), the
      // browser forbids reading pixels back, so the black backdrop
      // can't be removed — the live site has no such limit. Guarded so
      // the animation still runs either way.
      let frame;
      try { frame = ctx.getImageData(0, 0, W, H); } catch (e) { flight.rafId = requestAnimationFrame(tick); return; }
      const d = frame.data;
      for (let i = 0; i < d.length; i += 4) {
        const brightness = (d[i] + d[i + 1] + d[i + 2]) / 3;
        if (brightness <= CHROMA_BLACK_CUTOFF) {
          d[i + 3] = 0;
        } else if (brightness < CHROMA_BLACK_CUTOFF + CHROMA_FADE_RANGE) {
          d[i + 3] = Math.round((brightness - CHROMA_BLACK_CUTOFF) / CHROMA_FADE_RANGE * 255);
        }
      }
      ctx.putImageData(frame, 0, 0);
    }
    flight.rafId = requestAnimationFrame(tick);
  }
  flight.active = true;
  tick();
}
function stopChromaKey(flight) {
  flight.active = false;
  if (flight.rafId) cancelAnimationFrame(flight.rafId);
}

// 每篇貼文同時只允許一個表情在飛/播放中，換選別的表情時，前一個會瞬間消失，不會疊在一起
// Each post allows only one flying/playing emoji at a time — picking a
// different one makes the previous one disappear instantly instead of
// overlapping with it
const flightState = {}; // key: postId -> { overlay, canvas, video, type, sourceBtn, timers, active, rafId }
const flyToCenterDuration = 280;
const returnDuration = 250;
const centerScale = 8;
const centerOpacity = 0.65;
const playOpacity = 0.75;  // 播放時75%透明度 / plays at 75% opacity
const restScale = 1;
const restOpacity = 1;
const targetPlaySeconds = 2.3; // 加速播完，连同飞入和吹散整段约3秒 / sped up so fly-in + play + blow-away totals ~3s
const CHROMA_CANVAS_MAX_DIM = 540; // canvas 內部解析度上限：接近原片解析度，放大也清晰 / internal resolution cap: near the source video's own, stays crisp enlarged

function playFlyToCenter(postId, emojiType, sourceBtn) {
  if (!VIDEO_MAP[emojiType]) return;
  const card = sourceBtn.closest('.card');
  if (!card) return;

  // 如果這篇貼文已經有表情在飛，先瞬間收掉再開始新的
  if (flightState[postId]) {
    cleanupFlight(postId, true);
  }

  const video = acquireVideo(emojiType);
  const emojiSpan = sourceBtn.querySelector('.emoji');
  const startRect = emojiSpan.getBoundingClientRect();
  const cardRect = card.getBoundingClientRect();

  const postCenterX = cardRect.left + cardRect.width / 2;
  // 用「帖子目前看得到的那一段」的中央，而不是整张卡片的中央——
  // 卡片一半被滑出画面时，表情才不会跑到标题区或画面外
  // Center on the VISIBLE part of the card, not the whole card — so when
  // the card is half scrolled away the emoji never drifts into the
  // title area or off screen
  const mainBox = document.getElementById('mainContent');
  const containerTop = mainBox ? mainBox.getBoundingClientRect().top : 0;
  const visTop = Math.max(cardRect.top, containerTop);
  const visBottom = Math.min(cardRect.bottom, window.innerHeight);
  const postCenterY = (visBottom - visTop > 120)
    ? (visTop + (visBottom - visTop) * 0.45)
    : (cardRect.top + cardRect.height * 0.42);
  const startW = startRect.width;
  const startH = startRect.height;
  const startCenterX = startRect.left + startW / 2;
  const startCenterY = startRect.top + startH / 2;
  const deltaX = postCenterX - startCenterX;
  const deltaY = postCenterY - startCenterY;

  sourceBtn.classList.add('flying-source');

  const nativeW = video.videoWidth || 592;
  const nativeH = video.videoHeight || 576;
  const canvasScale = Math.min(1, CHROMA_CANVAS_MAX_DIM / Math.max(nativeW, nativeH));

  const canvas = document.createElement('canvas');
  canvas.width = Math.max(1, Math.round(nativeW * canvasScale));
  canvas.height = Math.max(1, Math.round(nativeH * canvasScale));

  // 關鍵：外框一開始就用「放大後」的真實大小，先 scale 縮小到按鈕尺寸，
  // 飛到中間時放大回 1 —— 永遠不是把小畫面硬拉大，所以不會糊
  // （跟圖片版同一個修法）
  // Key: the box is created at its FINAL enlarged size and starts
  // scaled DOWN to button size, growing back to 1 at the center — the
  // picture is never stretched up past its real size, so it stays
  // crisp (same fix as the image version)
  const bigW = startW * centerScale;
  const bigH = startH * centerScale;
  const startScaleRatio = 1 / centerScale;

  const overlay = document.createElement('div');
  overlay.className = 'fly-overlay';
  overlay.style.width = bigW + 'px';
  overlay.style.height = bigH + 'px';
  overlay.style.left = (startCenterX - bigW / 2) + 'px';
  overlay.style.top = (startCenterY - bigH / 2) + 'px';
  overlay.style.opacity = '1';
  overlay.style.transform = 'translate(0px, 0px) scale(' + startScaleRatio + ') rotate(0deg)';
  overlay.appendChild(canvas);
  document.body.appendChild(overlay);

  const flight = { overlay: overlay, canvas: canvas, sourceBtn: sourceBtn, video: video, type: emojiType, timers: [], active: false, rafId: null, startScaleRatio: startScaleRatio, deltaX: deltaX, deltaY: deltaY };
  flightState[postId] = flight;

  overlay.style.transition = 'transform ' + flyToCenterDuration + 'ms cubic-bezier(.34,1.56,.64,1), opacity ' + flyToCenterDuration + 'ms ease';
  requestAnimationFrame(function() {
    requestAnimationFrame(function() {
      overlay.style.transform = 'translate(' + deltaX + 'px, ' + deltaY + 'px) scale(1.06) rotate(4deg)';
      overlay.style.opacity = centerOpacity;
    });
  });

  const t1 = setTimeout(function() {
    overlay.style.transition = 'transform 120ms ease-out, opacity 200ms ease-out';
    overlay.style.transform = 'translate(' + deltaX + 'px, ' + deltaY + 'px) scale(1) rotate(0deg)';
    overlay.style.opacity = playOpacity;

    video.currentTime = 0;
    const playbackRate = (video.duration && isFinite(video.duration) && video.duration > 0)
      ? (video.duration / targetPlaySeconds) : 1;
    video.playbackRate = playbackRate;
    const playPromise = video.play();
    if (playPromise && playPromise.catch) { playPromise.catch(function() {}); }
    startChromaKey(flight);

    const onEnded = function() { cleanupFlight(postId, false); };
    video.addEventListener('ended', onEnded, { once: true });
    flight.onEnded = onEnded;

    const actualPlayMs = (video.duration && isFinite(video.duration) ? (video.duration * 1000 / playbackRate) : targetPlaySeconds * 1000);
    const t2 = setTimeout(function() {
      if (flightState[postId]) cleanupFlight(postId, false);
    }, actualPlayMs + 400);
    flight.timers.push(t2);
  }, flyToCenterDuration);
  flight.timers.push(t1);
}

function cleanupFlight(postId, instant) {
  const state = flightState[postId];
  if (!state) return;
  delete flightState[postId];

  state.timers.forEach(clearTimeout);
  if (state.onEnded) state.video.removeEventListener('ended', state.onEnded);
  stopChromaKey(state);
  state.video.pause();

  const overlay = state.overlay;
  const finish = function() {
    overlay.remove();
    state.sourceBtn.classList.remove('flying-source');
    releaseVideo(state.type, state.video);
  };

  if (instant) { finish(); return; }

  // 像被风吹走一样：往右上飘、旋转、缩小、淡出，然后消失
  // Like a gust of wind: drifts up and to the right, spinning, shrinking
  // and fading, then it's gone
  const windMs = 420; // 280ms飞入 + 2300ms播放 + 420ms吹散 = 整整3秒 / exactly 3s total
  const dx = (state.deltaX || 0) + 180;
  const dy = (state.deltaY || 0) - 140;
  overlay.style.transition = 'transform ' + windMs + 'ms cubic-bezier(.45,.05,.85,.4), opacity ' + windMs + 'ms ease-in';
  overlay.style.transform = 'translate(' + dx + 'px, ' + dy + 'px) scale(0.45) rotate(32deg)';
  overlay.style.opacity = '0';
  setTimeout(finish, windMs + 30);
}

// ---- 備用簡化版：先用現有的高清表情圖片，飛到帖子中間、放大、停一下再縮回 ----
// ---- 等新的透明背景動畫準備好，再換回上面完整的 MASTER 影片版本（playFlyToCenter）----
// Fallback simple version: uses the existing HD emoji images to fly up,
// scale up big, hold briefly, then shrink back. Swap the call in
// toggleReaction() back to playFlyToCenter() once the new
// transparent-background animations are ready.
const simpleFlightState = {}; // key: postId -> { overlay, sourceBtn, timers }
const simpleFlyDuration = 280;
const simpleReturnDuration = 250;
const simpleHoldMs = 700;
const simpleCenterScale = 8;
const simpleRestScale = 1;

function playFlyToCenterSimple(postId, emojiType, sourceBtn) {
  const card = sourceBtn.closest('.card');
  if (!card) return;

  if (simpleFlightState[postId]) {
    cleanupSimpleFlight(postId, true);
  }

  const emojiSpan = sourceBtn.querySelector('.emoji');
  const startRect = emojiSpan.getBoundingClientRect();
  const cardRect = card.getBoundingClientRect();

  const postCenterX = cardRect.left + cardRect.width / 2;
  const postCenterY = cardRect.top + cardRect.height * 0.42; // 比正中間再往上一點 / a bit above dead-center
  const startW = startRect.width;
  const startH = startRect.height;
  const startCenterX = startRect.left + startW / 2;
  const startCenterY = startRect.top + startH / 2;
  const deltaX = postCenterX - startCenterX;
  const deltaY = postCenterY - startCenterY;

  sourceBtn.classList.add('flying-source');

  // 關鍵：框架一開始就用「放大後」的真實大小來畫圖，一開始只是用 scale
  // 縮小讓它看起來跟按鈕一樣小——這樣圖片永遠是照大尺寸畫的，不會因為
  // 「先畫小、再放大」而變糊。中心點對齊按鈕原本的位置，看起來才不會跳動。
  // Key fix: the box is sized at the FINAL (enlarged) pixel size from the
  // start; scale is only ever used to shrink it down to button-size
  // visually. This means the image is always rasterized at its big,
  // crisp size — it's never "drawn small, then stretched", which is
  // what was causing the blur. Centered on the button's own center so
  // it doesn't visually jump.
  const bigW = startW * simpleCenterScale;
  const bigH = startH * simpleCenterScale;
  const startScaleRatio = 1 / simpleCenterScale;

  const overlay = document.createElement('div');
  overlay.className = 'fly-overlay';
  overlay.style.width = bigW + 'px';
  overlay.style.height = bigH + 'px';
  overlay.style.left = (startCenterX - bigW / 2) + 'px';
  overlay.style.top = (startCenterY - bigH / 2) + 'px';
  overlay.style.opacity = '1';
  overlay.style.transform = 'translate(0px, 0px) scale(' + startScaleRatio + ') rotate(0deg)';
  overlay.innerHTML = '<img src="' + EMOJI_MAP[emojiType] + '" alt="" style="width:100%;height:100%;object-fit:contain;display:block;">';
  document.body.appendChild(overlay);

  const flight = { overlay: overlay, sourceBtn: sourceBtn, timers: [] };
  simpleFlightState[postId] = flight;

  overlay.style.transition = 'transform ' + simpleFlyDuration + 'ms cubic-bezier(.34,1.56,.64,1)';
  requestAnimationFrame(function() {
    requestAnimationFrame(function() {
      overlay.style.transform = 'translate(' + deltaX + 'px, ' + deltaY + 'px) scale(1.08) rotate(6deg)';
    });
  });

  const t1 = setTimeout(function() {
    overlay.style.transition = 'transform 120ms ease-out';
    overlay.style.transform = 'translate(' + deltaX + 'px, ' + deltaY + 'px) scale(1) rotate(0deg)';
    const t2 = setTimeout(function() {
      cleanupSimpleFlight(postId, false, startScaleRatio);
    }, simpleHoldMs);
    flight.timers.push(t2);
  }, simpleFlyDuration);
  flight.timers.push(t1);
}

function cleanupSimpleFlight(postId, instant, startScaleRatio) {
  const state = simpleFlightState[postId];
  if (!state) return;
  delete simpleFlightState[postId];
  state.timers.forEach(clearTimeout);

  const overlay = state.overlay;
  const finish = function() {
    overlay.remove();
    state.sourceBtn.classList.remove('flying-source');
  };
  if (instant) { finish(); return; }

  // 縮回去也是用 scale 縮小（框架還是大尺寸），所以收回去的最後一刻也不會糊
  // Shrinking back is still just a scale-down of the same big box, so
  // the final moment of the return trip stays crisp too
  const ratio = startScaleRatio || 0.125;
  overlay.style.transition = 'transform ' + simpleReturnDuration + 'ms cubic-bezier(.55,0,1,.45), opacity ' + simpleReturnDuration + 'ms ease';
  overlay.style.transform = 'translate(0px, 0px) scale(' + ratio + ') rotate(0deg)';
  overlay.style.opacity = '0.9';
  setTimeout(finish, simpleReturnDuration + 30);
}

function renderReactions(postId, box) {
  box.innerHTML = '';
  Object.keys(EMOJI_MAP).forEach(function(type) {
    const btn = document.createElement('button');
    btn.className = 'react-btn';
    btn.dataset.type = type;
    btn.innerHTML = '<span class="emoji"><img src="' + EMOJI_MAP[type] + '" alt="' + type + '" draggable="false"></span>';
    btn.onclick = function() { toggleReaction(postId, type, box); };
    box.appendChild(btn);
  });

  const reactionRef = doc(db, 'posts', postId, 'reactions', currentUser.uid);
  getDoc(reactionRef).then(function(snap) {
    applySelectedState(box, snap.exists() ? snap.data().emojiType : null);
  });
}

// 播放这个 Emoji 专属的小动作 / Play this emoji's own little animation
// 留言送出成功时，整篇帖子也来一个大动作（飞信封橫扫过去）
// A big sweep across the whole post when a comment sends successfully (a flying love letter)
function playCommentBurst(anchorEl) {
  if (!anchorEl) return;
  const card = anchorEl.closest('.card');
  if (!card) return;
  const old = card.querySelector('.comment-burst');
  if (old) old.remove();
  const burst = document.createElement('div');
  burst.className = 'comment-burst';
  burst.innerHTML = '<span>💌</span>';
  card.appendChild(burst);
  burst.addEventListener('animationend', function() { burst.remove(); }, { once: true });
  setTimeout(function() { if (burst.parentNode) burst.remove(); }, 1500);
}

function playReactionAnimation(btn, emojiType) {
  if (!btn) return;
  const emojiSpan = btn.querySelector('.emoji');
  if (!emojiSpan) return;
  const className = 'react-anim-' + emojiType;
  emojiSpan.classList.remove(className); // 万一还没播完又点了一次，先重置 / reset in case it's still mid-animation
  void emojiSpan.offsetWidth; // 强迫浏览器重新计算一次，动画才会重新播放 / force a reflow so the animation restarts
  emojiSpan.classList.add(className);
  emojiSpan.addEventListener('animationend', function done() {
    emojiSpan.classList.remove(className);
    emojiSpan.removeEventListener('animationend', done);
  });

  // 以前這裡還有一個 PNG 圖片掃過貼文的動畫，現在由 MASTER 影片
  // 飛到中間的效果取代了，所以拿掉，只保留按鈕本身的小跳動
  // The old PNG sweep across the post is now replaced by the MASTER
  // video flying to the center, so only the button's own little
  // bounce remains here
}

async function toggleReaction(postId, emojiType, box) {
  // 直接看画面上现在是不是已经选中，不用先问 Google（这样才不用等网路）
  // Read the current state directly from the screen instead of asking
  // Google first (this is what keeps it from waiting on the network)
  const targetBtn = box.querySelector('.react-btn[data-type="' + emojiType + '"]');
  const already = !!(targetBtn && targetBtn.classList.contains('selected'));

  // 立刻更新画面 / update the screen immediately
  if (already) {
    applySelectedState(box, null);
    if (flightState[postId]) cleanupFlight(postId, true);
  } else {
    applySelectedState(box, emojiType);
    playPopSound(emojiType);
    playReactionAnimation(targetBtn, emojiType); // 按鈕上的小跳動 / the button's little bounce
    // MASTER 影片從按鈕飛到貼文中間，放大、半透明播 3 秒，再縮回按鈕
    // The MASTER video flies from the button to the post's center,
    // enlarged and semi-transparent for ~3s, then shrinks back
    playFlyToCenter(postId, emojiType, targetBtn);
  }

  // 背景偷偷跟 Firestore 同步，不会挡住画面 / sync to Firestore in the background, without blocking the UI
  const reactionRef = doc(db, 'posts', postId, 'reactions', currentUser.uid);
  try {
    if (already) {
      await deleteDoc(reactionRef);
    } else {
      await setDoc(reactionRef, { emojiType: emojiType, author: currentUser.email });
    }
  } catch (err) {
    // 同步失败就把画面改回去，并告诉你 / if the sync fails, revert the screen and let you know
    applySelectedState(box, already ? emojiType : null);
    alert('Emoji 反应失败，请重试 / Reaction failed, please try again: ' + err.message);
  }
}

// 五种反应各自的小音效——用 Web Audio 直接合成，不用另外载音乐文件
// A distinct short sound for each reaction — synthesized directly via
// Web Audio, no separate sound files needed
let audioCtx = null;
function getAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}

// 播放一个音符：类型、频率、开始时间(相对秒)、长度(秒)、音量
// Play one tone: waveform, frequency, start offset (sec), duration (sec), volume
function playTone(waveType, freq, startOffset, duration, volume, glideToFreq) {
  const ctx = getAudioCtx();
  const startTime = ctx.currentTime + startOffset;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = waveType;
  osc.frequency.setValueAtTime(freq, startTime);
  if (glideToFreq) {
    osc.frequency.exponentialRampToValueAtTime(glideToFreq, startTime + duration);
  }
  gain.gain.setValueAtTime(volume, startTime);
  gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.start(startTime);
  osc.stop(startTime + duration);
}

function playPopSound(emojiType) {
  try {
    if (emojiType === 'Love') {
      // 温柔上扬的两个音，像小心跳 / gentle two-note rise, like a little heartbeat
      playTone('sine', 500, 0, 0.12, 0.14);
      playTone('sine', 660, 0.1, 0.18, 0.14);
    } else if (emojiType === 'Like') {
      // 清脆短促、正向 / crisp, quick, upbeat
      playTone('triangle', 700, 0, 0.1, 0.15, 1050);
    } else if (emojiType === 'Support') {
      // 低沉有力，比较扎实 / a firmer, lower, confident thump
      playTone('square', 220, 0, 0.16, 0.11);
      playTone('sine', 220, 0, 0.16, 0.08);
    } else if (emojiType === 'Hug') {
      // 柔和绵长，比较温暖 / soft and sustained, warm
      playTone('sine', 440, 0, 0.35, 0.1);
      playTone('sine', 550, 0.05, 0.32, 0.07);
    } else if (emojiType === 'Angry') {
      // 短促粗糙、往下掉，比较刺耳 / short, coarse, dropping — a bit sharp
      playTone('sawtooth', 380, 0, 0.16, 0.1, 180);
    } else {
      playTone('sine', 600, 0, 0.15, 0.15, 900);
    }
  } catch (e) {
    // 有些浏览器可能不支援，忽略就好，不影响其他功能
    // Some browsers may not support this — ignore, doesn't affect anything else
  }
}

function applySelectedState(box, selectedType) {
  Array.from(box.querySelectorAll('.react-btn')).forEach(function(b) {
    b.classList.remove('selected', 'dimmed');
    if (selectedType) {
      if (b.dataset.type === selectedType) b.classList.add('selected');
      else b.classList.add('dimmed');
    }
  });
}

// ===== 留言 / Comments =====
function loadComments(postId, box) {
  const q = query(collection(db, 'posts', postId, 'comments'), orderBy('timestamp', 'asc'));
  let firstLoad = true;
  onSnapshot(q, function(snapshot) {
    // 只有真正「新增」的留言才播放跳入动画，不会让旧留言每次都重播一次
    // Only genuinely new comments play the pop-in animation — old ones
    // don't replay it every time the list re-renders
    const newlyAddedIds = firstLoad ? [] : snapshot.docChanges()
      .filter(function(change) { return change.type === 'added'; })
      .map(function(change) { return change.doc.id; });
    firstLoad = false;

    box.innerHTML = '';
    snapshot.forEach(function(docSnap) {
      const c = docSnap.data();
      const wrap = document.createElement('div');
      wrap.className = 'comment-block';

      const line = document.createElement('p');
      line.className = 'comment-line';
      if (newlyAddedIds.indexOf(docSnap.id) !== -1) {
        line.classList.add('comment-new');
      }
      line.textContent = displayName(c.author) + ': ' + c.content;
      wrap.appendChild(line);

      const reactRow = document.createElement('div');
      reactRow.className = 'comment-reactions-row';
      wrap.appendChild(reactRow);

      box.appendChild(wrap);
      renderCommentReactions(postId, docSnap.id, reactRow);
    });
  });
}

// ===== 留言 Emoji 反应 / Comment-level emoji reactions =====
// 跟帖子本身的反应不一样：点了之后不會馬上送出去，而是等 10 秒安靜沒有
// 再變動，才真正寫進 Firestore（也就是才會真正觸發通知）。這 10 秒內
// 換選或取消，都會重新倒數或整個取消，不會留下「半途」的那個選擇。
// Different from the post's own reaction: a comment reaction isn't
// written to Firestore immediately. It waits for 10 quiet seconds —
// switching or deselecting within that window restarts or cancels the
// timer, so only the choice you're still on after 10 seconds actually
// gets written (and so actually notifies).
const commentReactionState = {};  // key: postId+':'+commentId -> currently selected emojiType (or null)
const commentReactionTimers = {}; // same key -> pending setTimeout id
const COMMENT_NOTIFY_DELAY_MS = 10000;

function renderCommentReactions(postId, commentId, box) {
  box.innerHTML = '';
  Object.keys(EMOJI_MAP).forEach(function(type) {
    const btn = document.createElement('button');
    btn.className = 'react-btn';
    btn.dataset.type = type;
    btn.innerHTML = '<span class="emoji"><img src="' + EMOJI_MAP[type] + '" alt="' + type + '" draggable="false"></span>';
    btn.onclick = function() { toggleCommentReaction(postId, commentId, type, box); };
    box.appendChild(btn);
  });

  const key = postId + ':' + commentId;
  const reactionRef = doc(db, 'posts', postId, 'comments', commentId, 'commentReactions', currentUser.uid);
  getDoc(reactionRef).then(function(snap) {
    const current = snap.exists() ? snap.data().emojiType : null;
    commentReactionState[key] = current;
    applySelectedState(box, current);
  });
}

function toggleCommentReaction(postId, commentId, emojiType, box) {
  const key = postId + ':' + commentId;
  const already = commentReactionState[key] === emojiType;
  const newState = already ? null : emojiType;
  commentReactionState[key] = newState;
  applySelectedState(box, newState);
  if (!already) playPopSound(emojiType);

  // 不管這次是選、換選還是取消，都先把上一次排好的「送出」取消
  // Whatever just happened, first clear any write already queued from a
  // previous click on this comment
  if (commentReactionTimers[key]) {
    clearTimeout(commentReactionTimers[key]);
    delete commentReactionTimers[key];
  }

  const reactionRef = doc(db, 'posts', postId, 'comments', commentId, 'commentReactions', currentUser.uid);
  commentReactionTimers[key] = setTimeout(function() {
    delete commentReactionTimers[key];
    if (newState) {
      setDoc(reactionRef, { emojiType: newState, author: currentUser.email }).catch(function() {});
    } else {
      deleteDoc(reactionRef).catch(function() {});
    }
  }, COMMENT_NOTIFY_DELAY_MS);
}

// 送出留言时的小音效 / A short sound for sending a comment
function playSendSound() {
  try {
    playTone('sine', 520, 0, 0.1, 0.12, 780);
  } catch (e) { /* 忽略即可 / ignore */ }
}

window.submitComment = async function(postId) {
  const input = document.getElementById('commentInput-' + postId);
  const content = input.value.trim();
  if (!content) return;
  input.value = '';
  input.style.height = 'auto';

  // 送出的瞬间给一点反馈：按钮跳一下 + 一声轻响 + 整篇帖子的大动作
  // A bit of feedback right at the moment of sending: button pulses,
  // a soft chime, and a big sweep animation across the whole post
  const sendBtn = document.getElementById('commentSend-' + postId);
  if (sendBtn) {
    sendBtn.classList.remove('just-sent');
    void sendBtn.offsetWidth;
    sendBtn.classList.add('just-sent');
  }
  playSendSound();
  playCommentBurst(sendBtn);

  await addDoc(collection(db, 'posts', postId, 'comments'), {
    author: currentUser.email,
    content: content,
    timestamp: serverTimestamp()
  });
};

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}
