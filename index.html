<!DOCTYPE html>
<!--
  Only2ofUs — 转跳页面 / redirect launcher
  ==========================================
  唯一的功能：加到 iPhone 主屏幕后，点开图示会自动跳转到
  MrLow&MsFum 那个真正的网站。放这个转跳页面的原因是：
  Apps Script 网站本身被包在好几层 iframe 里，iPhone 抓不到
  我们自己设定的图示，只能看最外层——所以另外做这个最外层的
  小页面，负责显示图示，然后立刻带你去真正的网站。

  Only function: after adding to the iPhone home screen, tapping the
  icon auto-redirects to the real MrLow&MsFum site. This exists because
  Apps Script sites are nested inside several iframes, so iPhone can't
  see our custom icon there — this outer page shows the icon instead,
  then immediately forwards you to the real site.
-->
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>两人的空间</title>

  <!-- App 图示 / App icon -->
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">

  <!-- 让 iPhone 把它当成 App 打开，不显示浏览器网址列 -->
  <!-- Makes iPhone open it like an app, without the browser address bar -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="两人的空间">

  <!-- 自动转跳到真正的网站 / Auto-redirect to the real site -->
  <meta http-equiv="refresh" content="0; url=https://script.google.com/macros/s/AKfycbwV_FrIOtRKRQAQEv9Yc4ESjMQ69WYHRhVVWU6QysLuuHCfQsxkVZjmiIAbNGMx2oIRtw/exec">

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #1a1a2e;
      font-family: -apple-system, sans-serif;
      color: #cbb8e8;
    }
  </style>
</head>
<body>
  <p>正在打开两人的空间... / Opening...</p>
  <script>
    // 保险起见，如果 <meta refresh> 没生效，用 JS 再转跳一次
    // Backup in case the <meta refresh> doesn't fire
    window.location.href = "https://script.google.com/macros/s/AKfycbwV_FrIOtRKRQAQEv9Yc4ESjMQ69WYHRhVVWU6QysLuuHCfQsxkVZjmiIAbNGMx2oIRtw/exec";
  </script>
</body>
</html>
